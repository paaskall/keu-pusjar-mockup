<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realisasi</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['keuangan']);
  let filterTahun = 2026;

  function render() {
    const targets = DB.filter('targets', t => t.tahun === filterTahun).sort((a,b) => a.bulan - b.bulan);
    const realisasis = DB.filter('realisasis', r => r.tahun === filterTahun).sort((a,b) => b.tanggal.localeCompare(a.tanggal));

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Realisasi Keuangan</h2>
          <p class="text-sm text-gray-500 mt-1">Input & kelola realisasi per target</p>
        </div>
        <button onclick="openForm()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-md shadow-blue-200 flex items-center gap-2 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Input Realisasi
        </button>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 p-4 mb-5 shadow-sm flex flex-wrap gap-3 items-end">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Tahun Anggaran</label>
          <select id="filterTahun" onchange="changeTahun(this.value)" class="px-3 py-2 border border-gray-200 rounded-lg text-sm">
            ${[2026, 2025, 2024].map(y => `<option ${y === filterTahun ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="text-xs text-gray-500 ml-auto">
          Total ${realisasis.length} transaksi | Total: <b class="text-emerald-700">${formatRupiah(realisasis.reduce((s,r)=>s+r.nominal,0))}</b>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
            <tr>
              <th class="text-left px-4 py-3 font-semibold">Tanggal</th>
              <th class="text-left px-4 py-3 font-semibold">Periode</th>
              <th class="text-left px-4 py-3 font-semibold">Nominal</th>
              <th class="text-left px-4 py-3 font-semibold">Keterangan</th>
              <th class="text-right px-4 py-3 font-semibold w-32">Aksi</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            ${realisasis.length === 0 ? `<tr><td colspan="5" class="text-center py-8 text-gray-400">Belum ada realisasi untuk tahun ${filterTahun}</td></tr>` :
              realisasis.map(r => `
                <tr class="hover:bg-blue-50/40 transition">
                  <td class="px-4 py-3 text-gray-700">${formatTanggal(r.tanggal)}</td>
                  <td class="px-4 py-3 text-gray-600">${monthName(r.bulan)} ${r.tahun}</td>
                  <td class="px-4 py-3 font-semibold text-emerald-700">${formatRupiah(r.nominal)}</td>
                  <td class="px-4 py-3 text-gray-500 text-xs">${r.keterangan || '-'}</td>
                  <td class="px-4 py-3 text-right">
                    <button onclick="openForm(${r.id})" class="text-blue-700 hover:bg-blue-100 px-2 py-1 rounded transition" title="Edit">
                      <i data-lucide="edit-3" class="w-4 h-4"></i>
                    </button>
                    <button onclick="deleteItem(${r.id})" class="text-red-600 hover:bg-red-100 px-2 py-1 rounded transition ml-1" title="Hapus">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </td>
                </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;

    renderLayout('realisasi.html', main);
  }

  function changeTahun(y) { filterTahun = Number(y); render(); }

  function openForm(id) {
    const r = id ? DB.find('realisasis', x => x.id === id) : null;
    const targets = DB.filter('targets', t => t.tahun === filterTahun);

    Swal.fire({
      title: r ? 'Edit Realisasi' : 'Input Realisasi',
      html: `
        <div class="text-left space-y-3 text-sm">
          <div>
            <label class="block font-medium text-gray-700 mb-1">Target</label>
            <select id="f-target" class="w-full px-3 py-2 border border-gray-200 rounded-lg" ${r ? 'disabled' : ''}>
              ${targets.map(t => `
                <option value="${t.id}" ${r?.targetId === t.id ? 'selected' : ''}>
                  ${monthName(t.bulan)} ${t.tahun} — Target ${formatRupiah(t.nominal)}
                </option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Tanggal</label>
            <input id="f-tanggal" type="date" class="w-full px-3 py-2 border border-gray-200 rounded-lg" value="${r ? r.tanggal : new Date().toISOString().substring(0,10)}" />
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Nominal (Rp)</label>
            <input id="f-nominal" type="text" inputmode="numeric" autocomplete="off"
              class="w-full px-3 py-2 border border-gray-200 rounded-lg text-right font-mono"
              value="${r ? formatNumberInput(r.nominal) : ''}"
              placeholder="0" />
            <p class="text-[10px] text-gray-400 mt-1" id="f-nominal-preview">Rp 0</p>
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Keterangan</label>
            <textarea id="f-ket" rows="2" class="w-full px-3 py-2 border border-gray-200 rounded-lg">${r ? (r.keterangan || '') : ''}</textarea>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Simpan',
      cancelButtonText: 'Batal',
      customClass: {
        confirmButton: 'bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-lg mx-1',
        cancelButton: 'bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-5 py-2.5 rounded-lg mx-1'
      },
      buttonsStyling: false,
      didOpen: () => {
        // Pasang auto-format ke input nominal
        const nominalEl = document.getElementById('f-nominal');
        const previewEl = document.getElementById('f-nominal-preview');

        attachNumberFormat(nominalEl);

        // Live preview "Rp xxx"
        nominalEl.addEventListener('input', () => {
          const val = parseNumberInput(nominalEl.value);
          previewEl.textContent = 'Rp ' + val.toLocaleString('id-ID');
        });

        // Initial preview kalau edit
        if (nominalEl.value) {
          const val = parseNumberInput(nominalEl.value);
          previewEl.textContent = 'Rp ' + val.toLocaleString('id-ID');
        }
      },
      preConfirm: () => {
        const targetId = Number(document.getElementById('f-target').value);
        const tanggal = document.getElementById('f-tanggal').value;
        const nominal = parseNumberInput(document.getElementById('f-nominal').value);
        const keterangan = document.getElementById('f-ket').value.trim();

        if (!targetId || !tanggal || nominal <= 0) {
          Swal.showValidationMessage('Target, tanggal, dan nominal wajib diisi dengan benar');
          return false;
        }
        return { targetId, tanggal, nominal, keterangan };
      }
    }).then(res => {
      if (!res.isConfirmed) return;
      const data = res.value;
      const target = DB.find('targets', t => t.id === data.targetId);
      const db = DB.load();

      if (r) {
        const idx = db.realisasis.findIndex(x => x.id === id);
        const before = formatRupiah(db.realisasis[idx].nominal);
        db.realisasis[idx] = { ...db.realisasis[idx], ...data, bulan: target.bulan, tahun: target.tahun };
        DB.save(db);
        recordAudit({ action: 'UPDATE', module: 'Realisasi', recordId: `RLS-${String(id).padStart(5, '0')}`, before, after: formatRupiah(data.nominal) });
        toastSuccess('Realisasi berhasil diupdate');
      } else {
        const newId = db.meta.nextRealisasiId || (Math.max(0, ...db.realisasis.map(x => x.id)) + 1);
        db.meta.nextRealisasiId = newId + 1;
        db.realisasis.push({
          id: newId,
          ...data,
          bulan: target.bulan,
          tahun: target.tahun,
          userId: AUTH.currentUser().id
        });
        DB.save(db);
        recordAudit({ action: 'CREATE', module: 'Realisasi', recordId: `RLS-${String(newId).padStart(5, '0')}`, after: formatRupiah(data.nominal) });
        toastSuccess('Realisasi berhasil disimpan');
      }
      render();
    });
  }

  function deleteItem(id) {
    const r = DB.find('realisasis', x => x.id === id);
    confirmAction(
      'Hapus realisasi ini?',
      `Realisasi ${formatRupiah(r.nominal)} pada ${formatTanggal(r.tanggal)} akan dihapus.`,
      () => {
        DB.remove('realisasis', id);
        recordAudit({ action: 'DELETE', module: 'Realisasi', recordId: `RLS-${String(id).padStart(5, '0')}`, before: formatRupiah(r.nominal), after: '-' });
        toastSuccess('Realisasi berhasil dihapus');
        render();
      },
      { icon: 'warning', confirmText: 'Ya, Hapus' }
    );
  }

  render();
</script>
</body>
</html>
