<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIKAP - Realisasi</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .input-nominal {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .detail-expand {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .detail-expand.open { max-height: 1000px; }
  .chevron-icon { transition: transform 0.3s ease; }
  .chevron-icon.rotate { transform: rotate(180deg); }
  tr[data-realisasi-id] { cursor: pointer; }
</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['keuangan']);
  let filterTahun = 2026;
  const openDetails = new Set();

  // ============ HELPER: HITUNG TOTAL REALISASI ============
  function hitungTotalRealisasi(r) {
    if (!r) return 0;
    // Struktur baru: pakai details
    if (r.details && r.details.length > 0) {
      return r.details.reduce((s, d) => s + (d.nominal || 0), 0);
    }
    // Struktur lama: fallback ke nominal
    return r.nominal || 0;
  }

  // ============ RENDER ============
  function render() {
    const targets = DB.filter('targets', t => t.tahun === filterTahun).sort((a,b) => a.bulan - b.bulan);
    const realisasis = DB.filter('realisasis', r => r.tahun === filterTahun).sort((a,b) => a.bulan - b.bulan);
    const db = DB.load();
    const kategoriList = db.master.kategoriTarget || [];

    // Stats
    const totalTarget = targets.reduce((s, t) => s + getTotalTargetBulanan(t), 0);
    const totalRealisasi = realisasis.reduce((s, r) => s + hitungTotalRealisasi(r), 0);
    const capaian = totalTarget > 0 ? Math.round((totalRealisasi / totalTarget) * 100) : 0;

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Realisasi Keuangan</h2>
          <p class="text-sm text-gray-500 mt-1">Input realisasi per komponen untuk setiap bulan</p>
        </div>
        <button onclick="openForm()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-md shadow-blue-200 flex items-center gap-2 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Input Realisasi
        </button>
      </div>

      <!-- Stat Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
        ${statCard({ label: 'Total Target ' + filterTahun, value: formatRupiah(totalTarget), icon: 'target', color: 'blue' })}
        ${statCard({ label: 'Total Realisasi', value: formatRupiah(totalRealisasi), icon: 'trending-up', color: 'emerald' })}
        ${statCard({ label: 'Capaian', value: capaian + '%', icon: 'percent', color: 'amber' })}
      </div>

      <!-- Filter Tahun -->
      <div class="bg-white rounded-xl border border-gray-100 p-4 mb-5 shadow-sm flex flex-wrap gap-3 items-end">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Tahun Anggaran</label>
          <select id="filterTahun" onchange="changeTahun(this.value)"
            class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            ${[2026, 2025, 2024].map(y => `<option ${y === filterTahun ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="text-xs text-gray-500 ml-auto self-center">
          ${realisasis.length} transaksi · Total: <b class="text-emerald-700">${formatRupiah(totalRealisasi)}</b>
        </div>
      </div>

      <!-- Tabel -->
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
              <tr>
                <th class="text-center px-5 py-4 font-semibold w-16">#</th>
                <th class="text-center px-5 py-4 font-semibold">Bulan</th>
                <th class="text-center px-5 py-4 font-semibold w-40">Tanggal</th>
                <th class="text-center px-5 py-4 font-semibold w-44">Komponen</th>
                <th class="text-center px-5 py-4 font-semibold w-56">Nominal</th>
                <th class="text-center px-5 py-4 font-semibold w-44">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${realisasis.length === 0 ? `
                <tr>
                  <td colspan="6" class="text-center py-10 text-gray-400">
                    <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                    <p class="text-sm">Belum ada realisasi untuk tahun ${filterTahun}</p>
                    <p class="text-xs mt-1">Klik "Input Realisasi" untuk memulai</p>
                  </td>
                </tr>` :
                realisasis.map((r, i) => {
                  const totalR = hitungTotalRealisasi(r);
                  const target = DB.find('targets', t => t.id === r.targetId);
                  const totalTargetBulan = target ? getTotalTargetBulanan(target) : 0;
                  const cap = totalTargetBulan > 0 ? Math.round((totalR / totalTargetBulan) * 100) : 0;
                  const isOpen = openDetails.has(r.id);
                  const detailCount = (r.details || []).length;

                  // Build detail rows
                  const detailRowsHtml = (r.details || []).map(d => {
                    const kat = kategoriList.find(k => k.id === d.kategoriId);
                    const targetKomponen = target ? (target.details || []).find(td => td.kategoriId === d.kategoriId) : null;
                    const targetNominal = targetKomponen ? getKomponenNominal(targetKomponen) : 0;
                    const capKomponen = targetNominal > 0 ? Math.round((d.nominal / targetNominal) * 100) : 0;
                    const capColor = capKomponen >= 100 ? 'text-green-700 bg-green-50'
                                   : capKomponen >= 70 ? 'text-blue-700 bg-blue-50'
                                   : capKomponen >= 40 ? 'text-amber-700 bg-amber-50'
                                   : 'text-red-700 bg-red-50';

                    return `
                      <tr class="border-b border-gray-100 last:border-0">
                        <td class="py-2.5 pl-8 pr-3 text-left">
                          <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-[10px] font-bold flex-shrink-0">
                              ${kat ? (kat.kode || kat.nama.substring(0, 3)).substring(0, 3) : '???'}
                            </div>
                            <span class="text-sm font-medium text-gray-800">${kat ? kat.nama : 'Tidak diketahui'}</span>
                          </div>
                        </td>
                        <td class="py-2.5 px-3 text-right font-mono text-sm font-semibold text-emerald-700 whitespace-nowrap">${formatRupiah(d.nominal)}</td>
                        <td class="py-2.5 px-3 text-right text-xs text-gray-500 whitespace-nowrap">${formatRupiah(targetNominal)}</td>
                        <td class="py-2.5 pl-3 pr-6 text-right">
                          <span class="inline-block text-xs font-bold px-2 py-0.5 rounded ${capColor}">${capKomponen}%</span>
                        </td>
                      </tr>`;
                  }).join('');

                  return `
                    <tr class="hover:bg-blue-50/40 transition"
                        data-realisasi-id="${r.id}"
                        onclick="toggleDetail(${r.id})">
                      <td class="px-5 py-4 text-center">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-600 text-xs font-bold">
                          ${i + 1}
                        </span>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                          <span class="font-semibold text-gray-800">${monthName(r.bulan)}</span>
                          <i data-lucide="chevron-down" class="chevron-icon w-3.5 h-3.5 text-gray-400 flex-shrink-0 ${isOpen ? 'rotate' : ''}"></i>
                        </div>
                      </td>
                      <td class="px-5 py-4 text-center text-gray-600 text-xs">
                        ${formatTanggal(r.tanggal)}
                      </td>
                      <td class="px-5 py-4 text-center">
                        <span class="inline-flex items-center gap-1.5 text-xs bg-purple-50 text-purple-700 font-semibold px-3 py-1.5 rounded-full">
                          <i data-lucide="layers" class="w-3 h-3"></i>
                          ${detailCount} komponen
                        </span>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <span class="font-mono font-bold text-emerald-700 whitespace-nowrap">${formatRupiah(totalR)}</span>
                      </td>
                      <td class="px-5 py-4" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-center gap-1">
                          <button onclick="toggleDetail(${r.id})"
                            class="text-purple-600 hover:bg-purple-100 p-2 rounded-lg transition" title="Lihat Detail">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                          </button>
                          <button onclick="openForm(${r.id})"
                            class="text-blue-700 hover:bg-blue-100 p-2 rounded-lg transition" title="Edit">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                          </button>
                          <button onclick="deleteItem(${r.id})"
                            class="text-red-600 hover:bg-red-100 p-2 rounded-lg transition" title="Hapus">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                          </button>
                        </div>
                      </td>
                    </tr>

                    <!-- Expand Detail -->
                    <tr data-expand-for="${r.id}" class="${isOpen ? '' : 'hidden'} bg-gradient-to-r from-emerald-50/60 to-blue-50/40">
                      <td colspan="6" class="p-0">
                        <div class="detail-expand ${isOpen ? 'open' : ''}">
                          <div class="px-6 py-4">
                            <div class="flex items-center justify-between mb-3">
                              <div class="flex items-center gap-2">
                                <i data-lucide="layers" class="w-4 h-4 text-emerald-700"></i>
                                <span class="text-xs font-bold text-emerald-900 uppercase tracking-wide">
                                  Rincian Realisasi - ${monthName(r.bulan)} ${r.tahun}
                                </span>
                              </div>
                              <span class="text-xs text-gray-500">${detailCount} komponen</span>
                            </div>

                            <div class="bg-white rounded-lg border border-emerald-100 overflow-hidden">
                              <table class="w-full text-sm">
                                <thead class="bg-emerald-50/70">
                                  <tr>
                                    <th class="text-left pl-8 pr-3 py-2 text-[10px] uppercase text-emerald-700 font-bold tracking-wider">Komponen</th>
                                    <th class="text-right px-3 py-2 text-[10px] uppercase text-emerald-700 font-bold tracking-wider">Realisasi</th>
                                    <th class="text-right px-3 py-2 text-[10px] uppercase text-emerald-700 font-bold tracking-wider">Target</th>
                                    <th class="text-right pr-6 pl-3 py-2 text-[10px] uppercase text-emerald-700 font-bold tracking-wider w-24">Capaian</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  ${detailRowsHtml || '<tr><td colspan="4" class="text-center py-4 text-gray-400 text-xs">Tidak ada komponen</td></tr>'}
                                </tbody>
                                <tfoot class="bg-emerald-50 border-t-2 border-emerald-200">
                                  <tr>
                                    <td class="pl-8 pr-3 py-3 font-bold text-emerald-900 text-sm">TOTAL</td>
                                    <td class="px-3 py-3 text-right font-mono font-bold text-emerald-800 text-sm whitespace-nowrap">${formatRupiah(totalR)}</td>
                                    <td class="px-3 py-3 text-right font-mono text-gray-500 text-sm whitespace-nowrap">${formatRupiah(totalTargetBulan)}</td>
                                    <td class="pr-6 pl-3 py-3 text-right text-xs font-bold text-emerald-700">${cap}%</td>
                                  </tr>
                                </tfoot>
                              </table>
                            </div>

                            ${r.keterangan ? `
                              <div class="mt-3 text-xs text-gray-500 flex items-start gap-2">
                                <i data-lucide="info" class="w-3.5 h-3.5 flex-shrink-0 mt-0.5"></i>
                                <span><b>Keterangan:</b> ${r.keterangan}</span>
                              </div>
                            ` : ''}

                            <div class="flex justify-end gap-2 mt-3">
                              <button onclick="event.stopPropagation(); openForm(${r.id})"
                                class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                                <i data-lucide="edit-3" class="w-3 h-3"></i> Edit Realisasi
                              </button>
                              <button onclick="event.stopPropagation(); toggleDetail(${r.id})"
                                class="text-xs bg-white hover:bg-gray-50 text-gray-600 font-semibold px-3 py-1.5 rounded-lg border border-gray-200 transition flex items-center gap-1.5">
                                <i data-lucide="x" class="w-3 h-3"></i> Tutup
                              </button>
                            </div>
                          </div>
                        </div>
                      </td>
                    </tr>`;
                }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    renderLayout('realisasi.html', main);
  }

  // ============ GANTI TAHUN ============
  function changeTahun(y) {
    filterTahun = Number(y);
    openDetails.clear();
    render();
  }

  // ============ TOGGLE DETAIL ============
  function toggleDetail(realisasiId) {
    const row = document.querySelector(`tr[data-realisasi-id="${realisasiId}"]`);
    const expandRow = document.querySelector(`tr[data-expand-for="${realisasiId}"]`);
    if (!row || !expandRow) return;

    const container = expandRow.querySelector('.detail-expand');
    const chevron = row.querySelector('.chevron-icon');
    const isOpen = openDetails.has(realisasiId);

    if (isOpen) {
      openDetails.delete(realisasiId);
      container.classList.remove('open');
      if (chevron) chevron.classList.remove('rotate');
      row.classList.remove('bg-blue-50/60');
      setTimeout(() => {
        if (!openDetails.has(realisasiId)) {
          expandRow.classList.add('hidden');
        }
      }, 350);
    } else {
      openDetails.add(realisasiId);
      expandRow.classList.remove('hidden');
      void container.offsetHeight;
      container.classList.add('open');
      if (chevron) chevron.classList.add('rotate');
      row.classList.add('bg-blue-50/60');
    }
  }

  // ============================================================
  // FORM OPEN (CREATE/EDIT)
  // ============================================================
  function openForm(id) {
    const r = id ? DB.find('realisasis', x => x.id === id) : null;
    const db = DB.load();
    const kategoriList = db.master.kategoriTarget || [];

    // Filter target yang belum punya realisasi (untuk mode create)
    const allTargets = DB.filter('targets', t => t.tahun === filterTahun);
    const availableTargets = r
      ? allTargets  // Edit mode: tampilkan semua
      : allTargets.filter(t => !DB.filter('realisasis', rr => rr.targetId === t.id).length);

    if (availableTargets.length === 0 && !r) {
      Swal.fire({
        icon: 'info',
        title: 'Semua Sudah Diinput',
        text: 'Semua target bulanan sudah memiliki realisasi untuk tahun ini.',
        confirmButtonText: 'OK'
      });
      return;
    }

    // Build form HTML
    const targetOptions = availableTargets.map(t => `
      <option value="${t.id}" ${r?.targetId === t.id ? 'selected' : ''}>
        ${monthName(t.bulan)} ${t.tahun} - Target ${formatRupiah(getTotalTargetBulanan(t))}
      </option>
    `).join('');

    const initialTarget = r
      ? DB.find('targets', t => t.id === r.targetId)
      : availableTargets[0];
    const initialDetails = initialTarget ? (initialTarget.details || []) : [];
    const existingRealisasiDetails = r?.details || [];

    // Build komponen rows (readonly - dari target)
    const komponenRows = initialDetails.map((td, idx) => {
      const kat = kategoriList.find(k => k.id === td.kategoriId);
      const targetNominal = getKomponenNominal(td);
      const existing = existingRealisasiDetails.find(rd => rd.kategoriId === td.kategoriId);
      const realisasiNominal = existing ? existing.nominal : 0;

      return `
        <div class="form-komponen-row flex items-center gap-3 py-2 border-b border-gray-100 last:border-0" data-kategori-id="${td.kategoriId}">
          <div class="w-7 h-7 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-[10px] font-bold flex-shrink-0">
            ${kat ? (kat.kode || kat.nama.substring(0, 3)).substring(0, 3) : '???'}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-800 truncate">${kat ? kat.nama : 'Tidak diketahui'}</p>
            <p class="text-[10px] text-gray-400">Target: ${formatRupiah(targetNominal)}</p>
          </div>
          <div class="relative w-44 flex-shrink-0">
            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs font-semibold pointer-events-none">Rp</span>
            <input type="text" inputmode="numeric" autocomplete="off"
              class="form-realisasi-nominal input-nominal w-full pl-8 pr-2 py-2 border border-gray-200 rounded-lg text-sm text-right font-mono focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
              value="${formatNumberInput(realisasiNominal)}" placeholder="0"
              data-kategori-id="${td.kategoriId}"
              data-target-nominal="${targetNominal}" />
          </div>
        </div>`;
    }).join('');

    Swal.fire({
      title: r ? 'Edit Realisasi' : 'Input Realisasi',
      width: 780,
      html: `
        <div class="text-left space-y-4 text-sm mt-2">
          <div>
            <label class="block font-semibold text-gray-700 mb-1.5 text-xs uppercase tracking-wide">Target Bulan</label>
            <select id="f-target" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 bg-white" ${r ? 'disabled' : ''}>
              ${targetOptions}
            </select>
          </div>

          <div>
            <label class="block font-semibold text-gray-700 mb-1.5 text-xs uppercase tracking-wide">Tanggal Realisasi</label>
            <input id="f-tanggal" type="date"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
              value="${r ? r.tanggal : new Date().toISOString().substring(0, 10)}" />
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block font-semibold text-gray-700 text-xs uppercase tracking-wide">Realisasi per Komponen</label>
              <button type="button" onclick="fillAllFromTarget()"
                class="text-[11px] bg-gray-100 hover:bg-blue-100 text-gray-600 hover:text-blue-700 font-semibold px-2.5 py-1 rounded-md transition flex items-center gap-1">
                <i data-lucide="wand-2" class="w-3 h-3"></i> Isi sesuai target
              </button>
            </div>
            <div id="form-komponen-container" class="bg-white border border-gray-200 rounded-lg p-3 max-h-80 overflow-y-auto">
              ${komponenRows || '<p class="text-center text-gray-400 text-xs py-4">Tidak ada komponen di target ini</p>'}
            </div>
          </div>

          <div class="bg-gradient-to-r from-emerald-50 to-blue-50 border border-emerald-100 rounded-lg p-3 flex items-center justify-between">
            <span class="text-sm font-semibold text-emerald-900 flex items-center gap-2">
              <i class="w-4 h-4"></i> Total Realisasi
            </span>
            <div class="text-right">
              <p id="f-total" class="text-lg font-bold text-emerald-800 font-mono">Rp 0</p>
              <p id="f-capaian" class="text-[10px] text-gray-500">Capaian: 0%</p>
            </div>
          </div>

          <div>
            <label class="block font-semibold text-gray-700 mb-1.5 text-xs uppercase tracking-wide">Keterangan (opsional)</label>
            <textarea id="f-ket" rows="2"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
              placeholder="Catatan tambahan...">${r ? (r.keterangan || '') : ''}</textarea>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: r ? 'Update' : 'Simpan',
      cancelButtonText: 'Batal',
      customClass: {
        confirmButton: 'bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-lg mx-1 transition',
        cancelButton: 'bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-5 py-2.5 rounded-lg mx-1 transition',
        popup: 'rounded-2xl'
      },
      buttonsStyling: false,
      didOpen: () => {
        if (window.lucide) lucide.createIcons();

        // Attach number format ke semua input
        document.querySelectorAll('.form-realisasi-nominal').forEach(inp => {
          attachNumberFormat(inp);
          inp.addEventListener('input', updateTotalForm);
        });

        // Kalau create mode, attach listener ke dropdown target
        const targetSelect = document.getElementById('f-target');
        if (targetSelect && !r) {
          targetSelect.addEventListener('change', rebuildKomponenRows);
        }

        updateTotalForm();
      },
      preConfirm: () => {
        const targetId = Number(document.getElementById('f-target').value);
        const tanggal = document.getElementById('f-tanggal').value;
        const keterangan = document.getElementById('f-ket').value.trim();

        if (!targetId || !tanggal) {
          Swal.showValidationMessage('Target dan tanggal wajib diisi');
          return false;
        }

        // Kumpulkan detail dari input
        const details = [];
        document.querySelectorAll('.form-komponen-row').forEach(row => {
          const inp = row.querySelector('.form-realisasi-nominal');
          const kategoriId = Number(inp.dataset.kategoriId);
          const nominal = parseNumberInput(inp.value);
          if (nominal > 0) {
            details.push({ kategoriId, nominal });
          }
        });

        if (details.length === 0) {
          Swal.showValidationMessage('Minimal isi 1 komponen dengan nominal > 0');
          return false;
        }

        return { targetId, tanggal, keterangan, details };
      }
    }).then(res => {
      if (!res.isConfirmed) return;
      const data = res.value;
      const target = DB.find('targets', t => t.id === data.targetId);
      const db = DB.load();
      const totalNominal = data.details.reduce((s, d) => s + d.nominal, 0);

      if (r) {
        // === UPDATE ===
        const idx = db.realisasis.findIndex(x => x.id === id);
        const before = formatRupiah(hitungTotalRealisasi(db.realisasis[idx]));
        db.realisasis[idx] = {
          ...db.realisasis[idx],
          ...data,
          nominal: totalNominal,
          bulan: target.bulan,
          tahun: target.tahun
        };
        DB.save(db);
        recordAudit({
          action: 'UPDATE',
          module: 'Realisasi',
          recordId: `RLS-${String(id).padStart(5, '0')}`,
          before,
          after: formatRupiah(totalNominal)
        });
        toastSuccess('Realisasi berhasil diupdate');
      } else {
        // === CREATE ===
        const newId = db.meta.nextRealisasiId || (Math.max(0, ...db.realisasis.map(x => x.id)) + 1);
        db.meta.nextRealisasiId = newId + 1;
        db.realisasis.push({
          id: newId,
          ...data,
          nominal: totalNominal,
          bulan: target.bulan,
          tahun: target.tahun,
          userId: AUTH.currentUser().id
        });
        DB.save(db);
        recordAudit({
          action: 'CREATE',
          module: 'Realisasi',
          recordId: `RLS-${String(newId).padStart(5, '0')}`,
          after: formatRupiah(totalNominal)
        });
        toastSuccess('Realisasi berhasil disimpan');
        openDetails.add(newId);
      }
      render();
    });
  }

  // ============ REBUILD KOMPONEN ROWS (saat target diganti) ============
  function rebuildKomponenRows() {
    const targetId = Number(document.getElementById('f-target').value);
    const target = DB.find('targets', t => t.id === targetId);
    const db = DB.load();
    const kategoriList = db.master.kategoriTarget || [];

    if (!target) return;

    const container = document.getElementById('form-komponen-container');
    if (!container) return;

    const html = (target.details || []).map(td => {
      const kat = kategoriList.find(k => k.id === td.kategoriId);
      const targetNominal = getKomponenNominal(td);

      return `
        <div class="form-komponen-row flex items-center gap-3 py-2 border-b border-gray-100 last:border-0" data-kategori-id="${td.kategoriId}">
          <div class="w-7 h-7 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-[10px] font-bold flex-shrink-0">
            ${kat ? (kat.kode || kat.nama.substring(0, 3)).substring(0, 3) : '???'}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-800 truncate">${kat ? kat.nama : 'Tidak diketahui'}</p>
            <p class="text-[10px] text-gray-400">Target: ${formatRupiah(targetNominal)}</p>
          </div>
          <div class="relative w-44 flex-shrink-0">
            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs font-semibold pointer-events-none">Rp</span>
            <input type="text" inputmode="numeric" autocomplete="off"
              class="form-realisasi-nominal input-nominal w-full pl-8 pr-2 py-2 border border-gray-200 rounded-lg text-sm text-right font-mono focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
              value="" placeholder="0"
              data-kategori-id="${td.kategoriId}"
              data-target-nominal="${targetNominal}" />
          </div>
        </div>`;
    }).join('');

    container.innerHTML = html || '<p class="text-center text-gray-400 text-xs py-4">Tidak ada komponen di target ini</p>';

    // Re-attach format & listener
    container.querySelectorAll('.form-realisasi-nominal').forEach(inp => {
      attachNumberFormat(inp);
      inp.addEventListener('input', updateTotalForm);
    });

    if (window.lucide) lucide.createIcons();
    updateTotalForm();
  }

  // ============ ISI SEMUA INPUT = TARGET ============
  function fillAllFromTarget() {
    document.querySelectorAll('.form-komponen-row').forEach(row => {
      const inp = row.querySelector('.form-realisasi-nominal');
      if (!inp) return;
      const targetNominal = Number(inp.dataset.targetNominal) || 0;
      inp.value = formatNumberInput(targetNominal);
    });
    updateTotalForm();
    toastInfo('Semua input diisi sesuai target');
  }

  // ============ UPDATE TOTAL FORM ============
  function updateTotalForm() {
    const totalEl = document.getElementById('f-total');
    const capEl = document.getElementById('f-capaian');
    if (!totalEl) return;

    let total = 0;
    let totalTarget = 0;
    document.querySelectorAll('.form-komponen-row').forEach(row => {
      const inp = row.querySelector('.form-realisasi-nominal');
      if (!inp) return;
      total += parseNumberInput(inp.value);
      totalTarget += Number(inp.dataset.targetNominal) || 0;
    });

    totalEl.textContent = formatRupiah(total);
    if (capEl) {
      const cap = totalTarget > 0 ? Math.round((total / totalTarget) * 100) : 0;
      capEl.textContent = `Capaian: ${cap}% dari target ${formatRupiah(totalTarget)}`;
    }
  }

  // ============ DELETE ============
  function deleteItem(id) {
    const r = DB.find('realisasis', x => x.id === id);
    const total = hitungTotalRealisasi(r);

    swalTheme.fire({
      title: 'Hapus Realisasi?',
      html: `<div class="text-sm text-gray-600 space-y-2">
        <p>Realisasi <b>${monthName(r.bulan)} ${r.tahun}</b> akan dihapus permanen.</p>
        <div class="bg-gray-50 rounded-lg p-3 text-xs">
          <div class="flex justify-between"><span>Tanggal:</span><b>${formatTanggal(r.tanggal)}</b></div>
          <div class="flex justify-between"><span>Total:</span><b class="text-emerald-700">${formatRupiah(total)}</b></div>
          <div class="flex justify-between"><span>Komponen:</span><b>${(r.details || []).length} item</b></div>
        </div>
      </div>`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Ya, Hapus',
      cancelButtonText: 'Batal'
    }).then(res => {
      if (!res.isConfirmed) return;

      DB.remove('realisasis', id);
      recordAudit({
        action: 'DELETE',
        module: 'Realisasi',
        recordId: `RLS-${String(id).padStart(5, '0')}`,
        before: formatRupiah(total),
        after: '-'
      });
      openDetails.delete(id);
      toastSuccess('Realisasi berhasil dihapus');
      render();
    });
  }

  // ============ INIT ============
  render();
</script>
</body>
</html>
