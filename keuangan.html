<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard User Keuangan</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['keuangan']);
  let filterTahun = 2026;

  function render() {
    const db = DB.load();
    const targets = DB.filter('targets', t => t.tahun === filterTahun).sort((a,b) => a.bulan - b.bulan);
    const realisasis = DB.filter('realisasis', r => r.tahun === filterTahun);

    const totalTarget = targets.reduce((s, t) => s + t.nominal, 0);
    const totalReal = realisasis.reduce((s, r) => s + r.nominal, 0);
    const capaian = totalTarget > 0 ? Math.round((totalReal / totalTarget) * 100) : 0;

    // Grafik bulanan (agregat realisasi per bulan)
    const perBulan = {};
    targets.forEach(t => { perBulan[t.bulan] = { target: t.nominal, real: 0 }; });
    realisasis.forEach(r => { if (perBulan[r.bulan]) perBulan[r.bulan].real += r.nominal; });

    const maxReal = Math.max(...Object.values(perBulan).map(x => x.real), 1);

    // Pengadaan aktif
    const pengadaanAktif = db.pengadaans.filter(p => p.statusId === 2).slice(0, 4);

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Dashboard User Keuangan</h2>
          <p class="text-sm text-gray-500 mt-1">Monitoring target &amp; realisasi keuangan</p>
        </div>
        <div class="flex gap-2">
          <select onchange="changeTahun(this.value)" class="px-3 py-2 border border-gray-200 rounded-lg text-sm">
            ${[2026, 2025, 2024].map(y => `<option ${y === filterTahun ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
          <a href="realisasi.html" class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-md shadow-blue-200 flex items-center gap-2 transition">
            <i data-lucide="plus" class="w-4 h-4"></i> Input Realisasi
          </a>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
        <div class="bg-gradient-to-br from-white to-blue-50 rounded-xl border border-blue-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Target</p>
            <i data-lucide="target" class="w-5 h-5 text-blue-600"></i>
          </div>
          <p class="text-2xl font-bold text-blue-800">${formatRupiah(totalTarget)}</p>
          <p class="text-xs text-gray-500 mt-1">Target tahunan ${filterTahun}</p>
        </div>

        <div class="bg-gradient-to-br from-white to-emerald-50 rounded-xl border border-emerald-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Realisasi</p>
            <i data-lucide="trending-up" class="w-5 h-5 text-emerald-600"></i>
          </div>
          <p class="text-2xl font-bold text-emerald-700">${formatRupiah(totalReal)}</p>
          <p class="text-xs text-gray-500 mt-1">${realisasis.length} transaksi tercatat</p>
        </div>

        <div class="bg-gradient-to-br from-white to-amber-50 rounded-xl border border-amber-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Capaian</p>
            <i data-lucide="percent" class="w-5 h-5 text-amber-600"></i>
          </div>
          <p class="text-2xl font-bold text-amber-700">${capaian}%</p>
          <div class="w-full bg-amber-100 rounded-full h-2 mt-2 overflow-hidden">
            <div class="bg-gradient-to-r from-amber-500 to-amber-400 h-full rounded-full" style="width:${Math.min(capaian, 100)}%"></div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
        <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-gray-800 flex items-center gap-2">
              <i data-lucide="bar-chart-3" class="w-5 h-5 text-blue-700"></i> Realisasi Bulanan ${filterTahun}
            </h3>
          </div>
          ${Object.keys(perBulan).length === 0 ? '<p class="text-sm text-gray-400">Belum ada data</p>' :
            Object.entries(perBulan).map(([b, v]) => {
              const pct = (v.real / maxReal) * 100;
              return `
                <div class="flex items-center gap-3 mb-3 text-xs">
                  <span class="w-10 text-gray-500 font-medium">${monthShort(Number(b))}</span>
                  <div class="flex-1 bg-gray-100 rounded-full h-3 overflow-hidden">
                    <div class="bg-gradient-to-r from-blue-700 to-blue-400 h-full rounded-full transition-all duration-700" style="width:${pct}%"></div>
                  </div>
                  <span class="w-24 text-right text-gray-700 font-semibold">${(v.real/1000000).toFixed(0)}Jt</span>
                </div>`;
            }).join('')}
        </div>

        <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-gray-800 flex items-center gap-2">
              <i data-lucide="package-check" class="w-5 h-5 text-blue-700"></i> Pengadaan Aktif
            </h3>
            <a href="pengadaan.html" class="text-xs text-blue-700 hover:underline font-medium flex items-center gap-1">
              Lihat Semua <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </a>
          </div>
          ${pengadaanAktif.length === 0 ? '<p class="text-sm text-gray-400">Tidak ada pengadaan aktif</p>' :
            pengadaanAktif.map(p => `
              <div class="flex items-center gap-3 mb-3">
                <span class="w-24 text-xs font-medium text-gray-700 truncate">${p.nama}</span>
                <div class="flex-1 bg-gray-200 rounded-full h-2.5 overflow-hidden">
                  <div class="bg-gradient-to-r from-blue-700 to-blue-500 h-full rounded-full" style="width:${p.progress}%"></div>
                </div>
                <span class="w-10 text-right text-xs font-bold text-blue-700">${p.progress}%</span>
              </div>`).join('')}
        </div>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="zap" class="w-5 h-5 text-blue-700"></i> Aksi Cepat
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <a href="target.html" class="flex flex-col items-center gap-2 p-4 bg-blue-50 hover:bg-blue-100 rounded-lg transition text-blue-700">
            <i data-lucide="target" class="w-6 h-6"></i>
            <span class="text-xs font-medium">Kelola Target</span>
          </a>
          <a href="realisasi.html" class="flex flex-col items-center gap-2 p-4 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition text-emerald-700">
            <i data-lucide="trending-up" class="w-6 h-6"></i>
            <span class="text-xs font-medium">Input Realisasi</span>
          </a>
          <a href="pengadaan.html" class="flex flex-col items-center gap-2 p-4 bg-amber-50 hover:bg-amber-100 rounded-lg transition text-amber-700">
            <i data-lucide="package" class="w-6 h-6"></i>
            <span class="text-xs font-medium">Pengadaan</span>
          </a>
          <a href="kendala.html" class="flex flex-col items-center gap-2 p-4 bg-red-50 hover:bg-red-100 rounded-lg transition text-red-700">
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            <span class="text-xs font-medium">Kendala</span>
          </a>
        </div>
      </div>
    `;

    renderLayout('keuangan.html', main);
  }

  function changeTahun(y) { filterTahun = Number(y); render(); }
  render();
</script>
</body>
</html>
