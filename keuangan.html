<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIKAP — Dashboard Keuangan</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .chart-bar {
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .chart-bar:hover {
    filter: brightness(1.1);
  }
</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['keuangan']);
  let filterTahun = 2026;

  // ============================================================
  // HELPER: Hitung total realisasi dari 1 record (dukung details)
  // ============================================================
  function hitungTotalRealisasi(r) {
    if (!r) return 0;
    if (r.details && Array.isArray(r.details) && r.details.length > 0) {
      return r.details.reduce((s, d) => s + (d.nominal || 0), 0);
    }
    return r.nominal || 0;
  }

  // ============================================================
  // RENDER
  // ============================================================
  function render() {
    const db = DB.load();
    const targets = DB.filter('targets', t => t.tahun === filterTahun).sort((a,b) => a.bulan - b.bulan);
    const realisasis = DB.filter('realisasis', r => r.tahun === filterTahun);
    const kategoriList = db.master.kategoriTarget || [];

    // ===== TOTAL =====
    const totalTarget = targets.reduce((s, t) => s + getTotalTargetBulanan(t), 0);
    const totalReal = realisasis.reduce((s, r) => s + hitungTotalRealisasi(r), 0);
    const capaian = totalTarget > 0 ? Math.round((totalReal / totalTarget) * 100) : 0;
    const selisih = totalTarget - totalReal;

    // ===== PER BULAN (target vs realisasi) =====
    const perBulan = {};
    targets.forEach(t => {
      perBulan[t.bulan] = {
        target: getTotalTargetBulanan(t),
        real: 0,
        targetId: t.id
      };
    });
    realisasis.forEach(r => {
      if (perBulan[r.bulan]) {
        perBulan[r.bulan].real += hitungTotalRealisasi(r);
      }
    });

    const maxValue = Math.max(
      ...Object.values(perBulan).map(x => Math.max(x.target, x.real)),
      1
    );

    // ===== CAPAIAN PER KOMPONEN (agregat tahunan) =====
    const komponenAggregate = {};
    targets.forEach(t => {
      (t.details || []).forEach(td => {
        if (!komponenAggregate[td.kategoriId]) {
          komponenAggregate[td.kategoriId] = { target: 0, real: 0 };
        }
        komponenAggregate[td.kategoriId].target += getKomponenNominal(td);
      });
    });

    realisasis.forEach(r => {
      (r.details || []).forEach(rd => {
        if (komponenAggregate[rd.kategoriId]) {
          komponenAggregate[rd.kategoriId].real += rd.nominal || 0;
        }
      });
    });

    const komponenStats = Object.entries(komponenAggregate).map(([kategoriId, data]) => {
      const kat = kategoriList.find(k => k.id === Number(kategoriId));
      const cap = data.target > 0 ? Math.round((data.real / data.target) * 100) : 0;
      return {
        kategoriId: Number(kategoriId),
        nama: kat ? kat.nama : 'Tidak diketahui',
        kode: kat ? (kat.kode || kat.nama.substring(0, 3)) : '???',
        target: data.target,
        real: data.real,
        capaian: cap
      };
    }).sort((a, b) => b.target - a.target);

    // ===== KENDALA AKTIF =====
    const kendalaAktif = db.kendalas.filter(k => k.status === 'Proses').length;

    // ===== BULAN INI =====
    const bulanIni = new Date().getMonth() + 1;
    const targetBulanIni = targets.find(t => t.bulan === bulanIni);
    const realBulanIni = realisasis.filter(r => r.bulan === bulanIni);
    const totalTargetBulanIni = targetBulanIni ? getTotalTargetBulanan(targetBulanIni) : 0;
    const totalRealBulanIni = realBulanIni.reduce((s, r) => s + hitungTotalRealisasi(r), 0);
    const capaianBulanIni = totalTargetBulanIni > 0
      ? Math.round((totalRealBulanIni / totalTargetBulanIni) * 100) : 0;

    const main = `
      <!-- Page Header -->
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-3 mb-1">
            <div class="w-1 h-8 bg-gradient-to-b from-blue-700 to-blue-400 rounded-full"></div>
            <h2 class="text-2xl font-bold text-gray-800">Dashboard Keuangan</h2>
          </div>
          <p class="text-sm text-gray-500 ml-4">Monitoring target &amp; realisasi keuangan tahun ${filterTahun}</p>
        </div>
        <div class="flex gap-2">
          <select onchange="changeTahun(this.value)"
            class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 bg-white">
            ${[2026, 2025, 2024].map(y => `<option ${y === filterTahun ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
          <a href="realisasi.html"
            class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-md shadow-blue-200 flex items-center gap-2 transition">
            <i data-lucide="plus" class="w-4 h-4"></i> Input Realisasi
          </a>
        </div>
      </div>

      <!-- ============ STAT CARDS ============ -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
        <!-- Target -->
        <div class="bg-gradient-to-br from-white to-blue-50 rounded-xl border border-blue-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Total Target</p>
            <div class="w-9 h-9 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center">
              <i data-lucide="target" class="w-4 h-4"></i>
            </div>
          </div>
          <p class="text-2xl font-bold text-blue-800">${formatRupiah(totalTarget)}</p>
          <p class="text-xs text-gray-500 mt-1">${targets.length} bulan terdaftar</p>
        </div>

        <!-- Realisasi -->
        <div class="bg-gradient-to-br from-white to-emerald-50 rounded-xl border border-emerald-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Total Realisasi</p>
            <div class="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
              <i data-lucide="trending-up" class="w-4 h-4"></i>
            </div>
          </div>
          <p class="text-2xl font-bold text-emerald-700">${formatRupiah(totalReal)}</p>
          <p class="text-xs text-gray-500 mt-1">${realisasis.length} transaksi tercatat</p>
        </div>

        <!-- Capaian -->
        <div class="bg-gradient-to-br from-white to-amber-50 rounded-xl border border-amber-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 uppercase font-semibold tracking-wider">Capaian</p>
            <div class="w-9 h-9 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center">
              <i data-lucide="percent" class="w-4 h-4"></i>
            </div>
          </div>
          <p class="text-2xl font-bold text-amber-700">${capaian}%</p>
          <div class="w-full bg-amber-100 rounded-full h-2 mt-2 overflow-hidden">
            <div class="bg-gradient-to-r from-amber-500 to-amber-400 h-full rounded-full transition-all duration-700"
                 style="width:${Math.min(capaian, 100)}%"></div>
          </div>
        </div>

        <!-- Selisih -->
        <div class="bg-gradient-to-br from-white to-${selisih > 0 ? 'red' : 'green'}-50 rounded-xl border border-${selisih > 0 ? 'red' : 'green'}-100 p-5 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 uppercase font-semibold tracking-wider">${selisih > 0 ? 'Belum Terserap' : 'Surplus'}</p>
            <div class="w-9 h-9 rounded-lg bg-${selisih > 0 ? 'red' : 'green'}-100 text-${selisih > 0 ? 'red' : 'green'}-700 flex items-center justify-center">
              <i data-lucide="${selisih > 0 ? 'alert-circle' : 'check-circle'}" class="w-4 h-4"></i>
            </div>
          </div>
          <p class="text-2xl font-bold text-${selisih > 0 ? 'red' : 'green'}-700">${formatRupiah(Math.abs(selisih))}</p>
          <p class="text-xs text-gray-500 mt-1">${selisih > 0 ? 'Perlu dipercepat' : 'Realisasi melebihi target'}</p>
        </div>
      </div>

      <!-- ============ HIGHLIGHT BULAN INI ============ -->
      ${totalTargetBulanIni > 0 ? `
        <div class="bg-gradient-to-r from-blue-600 to-blue-700 rounded-xl p-5 mb-6 text-white shadow-lg shadow-blue-200/50">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl bg-white/20 flex items-center justify-center">
                <i data-lucide="calendar-days" class="w-6 h-6"></i>
              </div>
              <div>
                <p class="text-xs text-blue-100 uppercase tracking-wider font-semibold">Bulan Ini — ${monthName(bulanIni)}</p>
                <p class="text-2xl font-bold">${capaianBulanIni}% Tercapai</p>
              </div>
            </div>
            <div class="flex gap-6 text-sm">
              <div>
                <p class="text-blue-100 text-xs mb-1">Target</p>
                <p class="font-bold font-mono">${formatRupiah(totalTargetBulanIni)}</p>
              </div>
              <div>
                <p class="text-blue-100 text-xs mb-1">Realisasi</p>
                <p class="font-bold font-mono">${formatRupiah(totalRealBulanIni)}</p>
              </div>
              <div>
                <p class="text-blue-100 text-xs mb-1">Kendala Aktif</p>
                <p class="font-bold">${kendalaAktif} item</p>
              </div>
            </div>
          </div>
        </div>
      ` : ''}

      <!-- ============ CHART BULANAN (Full Width) ============ -->
      <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm mb-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-gray-800 flex items-center gap-2">
            <i data-lucide="bar-chart-3" class="w-5 h-5 text-blue-700"></i>
            Target & Realisasi ${filterTahun}
          </h3>
          <div class="flex items-center gap-3 text-[10px]">
            <span class="flex items-center gap-1">
              <span class="w-3 h-3 rounded-sm bg-blue-200"></span> Target
            </span>
            <span class="flex items-center gap-1">
              <span class="w-3 h-3 rounded-sm bg-gradient-to-r from-emerald-600 to-emerald-400"></span> Realisasi
            </span>
          </div>
        </div>
        ${Object.keys(perBulan).length === 0 ? '<p class="text-sm text-gray-400 text-center py-8">Belum ada data</p>' :
          `<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3">
            ${Object.entries(perBulan).map(([b, v]) => {
              const targetPct = (v.target / maxValue) * 100;
              const realPct = (v.real / maxValue) * 100;
              const cap = v.target > 0 ? Math.round((v.real / v.target) * 100) : 0;
              const capColor = cap >= 100 ? 'text-green-700'
                             : cap >= 70 ? 'text-blue-700'
                             : cap >= 40 ? 'text-amber-700'
                             : 'text-red-700';
              return `
                <div>
                  <div class="flex items-center justify-between text-xs mb-1">
                    <span class="font-medium text-gray-700">${monthShort(Number(b))}</span>
                    <span class="font-bold ${capColor}">${cap}%</span>
                  </div>
                  <div class="space-y-1">
                    <div class="flex items-center gap-2">
                      <div class="flex-1 bg-gray-100 rounded-full h-2.5 overflow-hidden">
                        <div class="chart-bar bg-blue-200 h-full rounded-full" style="width:${targetPct}%"></div>
                      </div>
                      <span class="w-20 text-right text-[10px] text-gray-500 font-mono">${(v.target/1000000).toFixed(0)}Jt</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <div class="flex-1 bg-gray-100 rounded-full h-2.5 overflow-hidden">
                        <div class="chart-bar bg-gradient-to-r from-emerald-600 to-emerald-400 h-full rounded-full" style="width:${realPct}%"></div>
                      </div>
                      <span class="w-20 text-right text-[10px] text-emerald-700 font-mono font-semibold">${(v.real/1000000).toFixed(0)}Jt</span>
                    </div>
                  </div>
                </div>`;
            }).join('')}
          </div>`
        }
      </div>

      <!-- ============ CAPAIAN PER KOMPONEN ============ -->
      ${komponenStats.length > 0 ? `
        <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm mb-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-gray-800 flex items-center gap-2">
              <i data-lucide="layers" class="w-5 h-5 text-blue-700"></i>
              Capaian per Komponen (Tahunan)
            </h3>
            <span class="text-xs text-gray-500">${komponenStats.length} komponen</span>
          </div>
          <div class="space-y-3">
            ${komponenStats.map(k => {
              const capColor = k.capaian >= 100 ? 'from-green-600 to-green-400'
                             : k.capaian >= 70 ? 'from-blue-700 to-blue-500'
                             : k.capaian >= 40 ? 'from-amber-500 to-amber-400'
                             : 'from-red-500 to-red-400';
              const textColor = k.capaian >= 100 ? 'text-green-700'
                              : k.capaian >= 70 ? 'text-blue-700'
                              : k.capaian >= 40 ? 'text-amber-700'
                              : 'text-red-700';
              return `
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-700 flex items-center justify-center text-[10px] font-bold flex-shrink-0">
                    ${k.kode.substring(0, 4)}
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-1">
                      <span class="text-sm font-medium text-gray-800 truncate">${k.nama}</span>
                      <span class="text-xs font-bold ${textColor}">${k.capaian}%</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                      <div class="bg-gradient-to-r ${capColor} h-full rounded-full transition-all duration-700"
                           style="width:${Math.min(k.capaian, 100)}%"></div>
                    </div>
                    <div class="flex items-center justify-between text-[10px] text-gray-500 mt-1">
                      <span>Realisasi: <b class="font-mono">${formatRupiah(k.real)}</b></span>
                      <span>Target: <b class="font-mono">${formatRupiah(k.target)}</b></span>
                    </div>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>
      ` : ''}

      <!-- ============ AKSI CEPAT ============ -->
      <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="zap" class="w-5 h-5 text-blue-700"></i>
          Aksi Cepat
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
          <a href="target.html" class="flex flex-col items-center gap-2 p-4 bg-blue-50 hover:bg-blue-100 rounded-lg transition text-blue-700 group">
            <i data-lucide="target" class="w-6 h-6 group-hover:scale-110 transition"></i>
            <span class="text-xs font-medium">Kelola Target</span>
          </a>
          <a href="realisasi.html" class="flex flex-col items-center gap-2 p-4 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition text-emerald-700 group">
            <i data-lucide="trending-up" class="w-6 h-6 group-hover:scale-110 transition"></i>
            <span class="text-xs font-medium">Input Realisasi</span>
          </a>
          <a href="kendala.html" class="flex flex-col items-center gap-2 p-4 bg-red-50 hover:bg-red-100 rounded-lg transition text-red-700 group">
            <i data-lucide="alert-triangle" class="w-6 h-6 group-hover:scale-110 transition"></i>
            <span class="text-xs font-medium">Kendala</span>
          </a>
        </div>
      </div>
    `;

    renderLayout('keuangan.html', main);
  }

  function changeTahun(y) {
    filterTahun = Number(y);
    render();
  }

  render();
</script>
</body>
</html>
