<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Admin</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['admin']);

  const db = DB.load();
  const stats = {
    user: db.users.length,
    master: Object.values(db.master).reduce((s, arr) => s + arr.length, 0),
    log: db.auditTrail.length
  };

  const recentLogs = db.auditTrail.slice(0, 5);

  const main = `
    <div class="flex items-start justify-between gap-3 flex-wrap">
        <div class="flex items-start gap-3">
            <div class="w-1 h-10 bg-gradient-to-b from-blue-700 to-blue-400 rounded-full"></div>
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Selamat Datang, ${AUTH.currentUser().name}</h2>
                <p class="text-sm text-gray-500 mt-1">
                    <span class="font-semibold text-blue-700 uppercase text-xs tracking-wide">${AUTH.currentUser().role}</span>
                    <span class="mx-2 text-gray-300">·</span>
                    <span>${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span>
                </p>
            </div>
        </div>
            <div class="hidden md:flex items-center gap-2 text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full font-medium">
                <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                Sistem Aktif
            </div>
        </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
      ${statCard({ label: 'Total User', value: stats.user, icon: 'users', color: 'blue', onClick: `window.location.href='user.html'` })}
      ${statCard({ label: 'Total Master Data', value: stats.master, icon: 'database', color: 'emerald', onClick: `window.location.href='master.html'` })}
      ${statCard({ label: 'Total Log', value: stats.log, icon: 'scroll-text', color: 'amber', onClick: `window.location.href='audit.html'` })}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-6">
      <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-gray-800 flex items-center gap-2">
            <i data-lucide="activity" class="w-5 h-5 text-blue-700"></i> Aktivitas Terbaru
          </h3>
          <a href="audit.html" class="text-xs text-blue-700 hover:underline font-medium flex items-center gap-1">
            Lihat Semua <i data-lucide="arrow-right" class="w-3 h-3"></i>
          </a>
        </div>
        <ul class="divide-y divide-gray-100">
          ${recentLogs.map(l => {
            const iconMap = { CREATE: 'plus-circle', UPDATE: 'edit-3', DELETE: 'trash-2' };
            const colorMap = { CREATE: 'text-green-600 bg-green-50', UPDATE: 'text-blue-600 bg-blue-50', DELETE: 'text-red-600 bg-red-50' };
            return `
              <li class="flex items-center gap-3 py-3">
                <div class="w-9 h-9 rounded-lg ${colorMap[l.action]} flex items-center justify-center">
                  <i data-lucide="${iconMap[l.action]}" class="w-4 h-4"></i>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm text-gray-800 truncate">
                    <span class="font-semibold">${l.userName}</span>
                    <span class="text-xs font-bold ${l.action==='DELETE'?'text-red-700':l.action==='UPDATE'?'text-blue-700':'text-green-700'} mx-1">${l.action}</span>
                    <span class="text-gray-600">${l.module}</span>
                  </p>
                  <p class="text-[11px] text-gray-400 mt-0.5">${l.tanggal}</p>
                </div>
                <span class="text-xs font-mono text-gray-500">${l.recordId}</span>
              </li>`;
          }).join('')}
        </ul>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-5 h-5 text-blue-700"></i> Distribusi Modul Log
        </h3>
        ${(() => {
          const modulCount = {};
          db.auditTrail.forEach(l => { modulCount[l.module] = (modulCount[l.module] || 0) + 1; });
          const max = Math.max(...Object.values(modulCount), 1);
          return Object.entries(modulCount).map(([m, c]) => `
            <div class="flex items-center gap-3 mb-3 text-xs">
              <span class="w-24 text-gray-600 font-medium">${m}</span>
              <div class="flex-1 bg-gray-100 rounded-full h-2.5 overflow-hidden">
                <div class="bg-gradient-to-r from-blue-700 to-blue-500 h-full rounded-full" style="width:${(c/max)*100}%"></div>
              </div>
              <span class="w-8 text-right font-bold text-blue-700">${c}</span>
            </div>`).join('');
        })()}
      </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
      <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i data-lucide="zap" class="w-5 h-5 text-blue-700"></i> Aksi Cepat
      </h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <a href="user.html" class="flex flex-col items-center gap-2 p-4 bg-blue-50 hover:bg-blue-100 rounded-lg transition text-blue-700">
          <i data-lucide="user-plus" class="w-6 h-6"></i>
          <span class="text-xs font-medium">Kelola User</span>
        </a>
        <a href="master.html" class="flex flex-col items-center gap-2 p-4 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition text-emerald-700">
          <i data-lucide="database" class="w-6 h-6"></i>
          <span class="text-xs font-medium">Master Data</span>
        </a>
        <a href="audit.html" class="flex flex-col items-center gap-2 p-4 bg-amber-50 hover:bg-amber-100 rounded-lg transition text-amber-700">
          <i data-lucide="scroll-text" class="w-6 h-6"></i>
          <span class="text-xs font-medium">Audit Trail</span>
        </a>
        <button onclick="resetDemo()" class="flex flex-col items-center gap-2 p-4 bg-red-50 hover:bg-red-100 rounded-lg transition text-red-700">
          <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
          <span class="text-xs font-medium">Reset Demo</span>
        </button>
      </div>
    </div>
  `;

  renderLayout('admin.html', main);

  function resetDemo() {
    confirmAction('Reset Data Demo?', 'Semua data akan dikembalikan ke kondisi awal.', () => {
      withLoading('Merestore...', 'Mohon tunggu', 800, () => {
        DB.reset();
        toastSuccess('Data berhasil direset');
        setTimeout(() => location.reload(), 600);
      });
    }, { icon: 'warning', confirmText: 'Ya, Reset' });
  }
</script>
</body>
</html>
