<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIKAP - Kelola Target</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .input-nominal {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .detail-expand {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .detail-expand.open { max-height: 2000px; }
  .chevron-icon { transition: transform 0.3s ease; }
  .chevron-icon.rotate { transform: rotate(180deg); }
  tr[data-target-id] { cursor: pointer; }
  .detail-item { animation: slideIn 0.2s ease-out; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .detail-item.removing { animation: slideOut 0.15s ease-in forwards; }
  @keyframes slideOut { to { opacity: 0; transform: translateX(-10px); } }
</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['keuangan']);
  let filterTahun = 2026;
  const openDetails = new Set();

  // ============================================================
  // HELPER: Kumpulkan kombinasi Program-Sub-Komponen dari target
  // ============================================================
  function groupByProgram(details) {
    const groups = {};
    details.forEach(d => {
      const progId = d.programId;
      if (!groups[progId]) groups[progId] = {};
      const subId = d.subKegiatanId || 0;
      if (!groups[progId][subId]) groups[progId][subId] = [];
      groups[progId][subId].push(d);
    });
    return groups;
  }

  // ============================================================
  // RENDER
  // ============================================================
  function render() {
    const targets = DB.filter('targets', t => t.tahun === filterTahun).sort((a,b) => a.bulan - b.bulan);
    const totalTargetTahunan = targets.reduce((s, t) => s + getTotalTargetBulanan(t), 0);
    const rataRata = targets.length > 0 ? Math.round(totalTargetTahunan / targets.length) : 0;
    const db = DB.load();

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-3 mb-1">
            <div class="w-1 h-8 bg-gradient-to-b from-blue-700 to-blue-400 rounded-full"></div>
            <h2 class="text-2xl font-bold text-gray-800">Kelola Target</h2>
          </div>
          <p class="text-sm text-gray-500 ml-4">Target bulanan disusun dari Program → Sub-Kegiatan → Komponen Belanja</p>
        </div>
        <button onclick="openForm()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-md shadow-blue-200 flex items-center gap-2 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Tambah Target Bulanan
        </button>
      </div>

      <!-- Stat Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
        ${statCard({ label: 'Total Target ' + filterTahun, value: formatRupiah(totalTargetTahunan), icon: 'target', color: 'blue' })}
        ${statCard({ label: 'Jumlah Bulan Terdaftar', value: targets.length + ' bulan', icon: 'calendar', color: 'emerald' })}
        ${statCard({ label: 'Rata-rata per Bulan', value: formatRupiah(rataRata), icon: 'trending-up', color: 'amber' })}
      </div>

      <!-- Info Konsep -->
      <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-xl p-4 mb-5 flex items-start gap-3">
        <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center flex-shrink-0">
          <i data-lucide="lightbulb" class="w-5 h-5"></i>
        </div>
        <div class="text-sm text-gray-700">
          <p class="font-semibold text-blue-900 mb-1">Bagaimana target dihitung?</p>
          <p class="text-xs leading-relaxed">
            <b>Target Bulanan</b> = jumlah dari komponen belanja per program. Klik baris untuk melihat
            rincian lengkap: <b>Program</b> → <b>Sub-Kegiatan</b> → <b>Komponen Belanja</b>.
          </p>
        </div>
      </div>

      <!-- Filter Tahun -->
      <div class="bg-white rounded-xl border border-gray-100 p-4 mb-5 shadow-sm flex flex-wrap gap-3 items-end">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Tahun Anggaran</label>
          <select id="filterTahun" onchange="changeTahun(this.value)"
            class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            ${[2026, 2025, 2024].map(y => `<option ${y === filterTahun ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="text-xs text-gray-500 ml-auto self-center">
          ${targets.length} bulan terdaftar · Total: <b class="text-blue-700">${formatRupiah(totalTargetTahunan)}</b>
        </div>
      </div>

      <!-- Tabel dengan Accordion -->
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
              <tr>
                <th class="text-center px-5 py-4 font-semibold w-16">#</th>
                <th class="text-center px-5 py-4 font-semibold">Bulan</th>
                <th class="text-center px-5 py-4 font-semibold w-44">Detail</th>
                <th class="text-center px-5 py-4 font-semibold w-56">Target</th>
                <th class="text-center px-5 py-4 font-semibold w-32">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${targets.length === 0 ? `
                <tr>
                  <td colspan="5" class="text-center py-10 text-gray-400">
                    <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                    <p class="text-sm">Belum ada target untuk tahun ${filterTahun}</p>
                    <p class="text-xs mt-1">Klik "Tambah Target Bulanan" untuk memulai</p>
                  </td>
                </tr>` :
                targets.map((t, i) => {
                  const totalBulan = getTotalTargetBulanan(t);
                  const detailCount = (t.details || []).length;
                  const isOpen = openDetails.has(t.id);

                  // Kelompokkan detail per Program → Sub-Kegiatan
                  const grouped = groupByProgram(t.details || []);
                  const programIds = Object.keys(grouped).map(Number).sort((a,b) => a-b);

                  // Build accordion content per program
                  const programBlocksHtml = programIds.map(progId => {
                    const prog = getProgramById(progId);
                    const progName = prog ? prog.nama : 'Tidak diketahui';
                    const progKode = prog ? prog.kode : '???';

                    // Hitung total program
                    let progTotal = 0;
                    const subIds = Object.keys(grouped[progId]).map(Number).sort((a,b) => a-b);
                    subIds.forEach(subId => {
                      grouped[progId][subId].forEach(d => {
                        progTotal += getKomponenNominal(d);
                      });
                    });

                    const progPct = totalBulan > 0 ? ((progTotal / totalBulan) * 100).toFixed(1) : 0;

                    // Build sub-kegiatan blocks
                    const subBlocksHtml = subIds.map(subId => {
                      const sub = getSubKegiatanById(subId);
                      const subName = sub ? sub.nama : 'Tanpa Sub-Kegiatan';
                      const subKode = sub ? sub.kode : '-';
                      const details = grouped[progId][subId];

                      let subTotal = 0;
                      details.forEach(d => { subTotal += getKomponenNominal(d); });
                      const subPct = totalBulan > 0 ? ((subTotal / totalBulan) * 100).toFixed(1) : 0;

                      // Rows komponen belanja
                      const komponenRowsHtml = details.map(d => {
                        const kom = getKomponenBelanjaById(d.komponenId);
                        const nominal = getKomponenNominal(d);
                        const pct = totalBulan > 0 ? ((nominal / totalBulan) * 100).toFixed(1) : 0;
                        const hasSub = d.subDetails && d.subDetails.length > 0;

                        return `
                          <tr class="border-b border-gray-100 last:border-0 hover:bg-blue-50/30">
                            <td class="py-2.5 pl-14 pr-3 text-left">
                              <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-md bg-emerald-50 text-emerald-700 flex items-center justify-center text-[9px] font-bold flex-shrink-0">
                                  <i data-lucide="receipt" class="w-3 h-3"></i>
                                </div>
                                <div class="min-w-0">
                                  <p class="text-xs font-medium text-gray-800 truncate">${kom ? kom.nama : 'Tidak diketahui'}</p>
                                  ${kom ? `<p class="text-[9px] text-gray-400 font-mono">${kom.kode}</p>` : ''}
                                </div>
                                ${hasSub ? `<span class="text-[9px] bg-blue-100 text-blue-700 font-bold px-1.5 py-0.5 rounded-full ml-1">${d.subDetails.length} sub</span>` : ''}
                              </div>
                            </td>
                            <td class="py-2.5 px-3 text-right font-mono text-xs font-semibold text-emerald-700 whitespace-nowrap">${formatRupiah(nominal)}</td>
                            <td class="py-2.5 pl-3 pr-4 text-right text-[10px] text-gray-500 w-16">${pct}%</td>
                          </tr>`;
                      }).join('');

                      return `
                        <div class="mb-3 last:mb-0">
                          <!-- Sub-Kegiatan Header -->
                          <div class="flex items-center gap-2 px-3 py-2 bg-indigo-50/70 rounded-t-lg border border-indigo-100">
                            <div class="w-6 h-6 rounded-md bg-indigo-100 text-indigo-700 flex items-center justify-center flex-shrink-0">
                              <i data-lucide="git-branch" class="w-3 h-3"></i>
                            </div>
                            <span class="text-[10px] font-mono font-bold text-indigo-700 bg-white px-1.5 py-0.5 rounded">
                              ${subKode}
                            </span>
                            <span class="text-xs font-semibold text-gray-800 flex-1 truncate">${subName}</span>
                            <span class="text-xs font-bold text-indigo-700 whitespace-nowrap">${formatRupiah(subTotal)}</span>
                            <span class="text-[10px] text-gray-500 w-12 text-right">${subPct}%</span>
                          </div>
                          <!-- Komponen Belanja Table -->
                          <div class="bg-white border border-t-0 border-indigo-100 rounded-b-lg overflow-hidden">
                            <table class="w-full">
                              <tbody>${komponenRowsHtml}</tbody>
                            </table>
                          </div>
                        </div>`;
                    }).join('');

                    return `
                      <div class="mb-4 last:mb-0">
                        <!-- Program Header -->
                        <div class="flex items-center gap-2.5 px-3 py-2.5 bg-blue-100/80 rounded-lg border border-blue-200 mb-2">
                          <div class="w-7 h-7 rounded-md bg-blue-700 text-white flex items-center justify-center flex-shrink-0">
                            <i data-lucide="folder-kanban" class="w-3.5 h-3.5"></i>
                          </div>
                          <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                              <span class="text-[10px] font-mono font-bold text-blue-700 bg-white px-1.5 py-0.5 rounded">
                                ${progKode}
                              </span>
                              <span class="text-xs font-bold text-blue-900 truncate">${progName}</span>
                            </div>
                          </div>
                          <span class="text-sm font-bold text-blue-800 whitespace-nowrap">${formatRupiah(progTotal)}</span>
                          <span class="text-[10px] text-blue-700 w-12 text-right">${progPct}%</span>
                        </div>
                        <!-- Sub-Kegiatan -->
                        <div class="pl-3">
                          ${subBlocksHtml}
                        </div>
                      </div>`;
                  }).join('');

                  return `
                    <!-- Baris Utama -->
                    <tr class="hover:bg-blue-50/40 transition"
                        data-target-id="${t.id}"
                        onclick="toggleDetail(${t.id})">
                      <td class="px-5 py-4 text-center">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-600 text-xs font-bold">
                          ${i + 1}
                        </span>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                          <span class="font-semibold text-gray-800">${monthName(t.bulan)}</span>
                          <i data-lucide="chevron-down" class="chevron-icon w-3.5 h-3.5 text-gray-400 flex-shrink-0 ${isOpen ? 'rotate' : ''}"></i>
                        </div>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <span class="inline-flex items-center gap-1.5 text-xs bg-purple-50 text-purple-700 font-semibold px-3 py-1.5 rounded-full">
                          <i data-lucide="layers" class="w-3 h-3"></i>
                          ${detailCount} item
                        </span>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <span class="font-mono font-bold text-blue-700 whitespace-nowrap">${formatRupiah(totalBulan)}</span>
                      </td>
                      <td class="px-5 py-4" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-center gap-1">
                          <button onclick="toggleDetail(${t.id})"
                            class="text-purple-600 hover:bg-purple-100 p-2 rounded-lg transition" title="Lihat Detail">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                          </button>
                          <button onclick="openForm(${t.id})"
                            class="text-blue-700 hover:bg-blue-100 p-2 rounded-lg transition" title="Edit">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                          </button>
                        </div>
                      </td>
                    </tr>

                    <!-- Expand Detail -->
                    <tr data-expand-for="${t.id}" class="${isOpen ? '' : 'hidden'} bg-gradient-to-r from-blue-50/40 to-indigo-50/30">
                      <td colspan="5" class="p-0">
                        <div class="detail-expand ${isOpen ? 'open' : ''}">
                          <div class="px-6 py-4">
                            <div class="flex items-center justify-between mb-4">
                              <div class="flex items-center gap-2">
                                <i data-lucide="layers" class="w-4 h-4 text-blue-700"></i>
                                <span class="text-xs font-bold text-blue-900 uppercase tracking-wide">
                                  Rincian Target - ${monthName(t.bulan)} ${t.tahun}
                                </span>
                              </div>
                              <span class="text-xs text-gray-500">Total: ${formatRupiah(totalBulan)}</span>
                            </div>

                            ${programBlocksHtml || '<p class="text-sm text-gray-400 text-center py-4">Tidak ada komponen</p>'}

                            <div class="flex justify-end gap-2 mt-4">
                              <button onclick="event.stopPropagation(); openForm(${t.id})"
                                class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                                <i data-lucide="edit-3" class="w-3 h-3"></i> Edit Target
                              </button>
                              <button onclick="event.stopPropagation(); toggleDetail(${t.id})"
                                class="text-xs bg-white hover:bg-gray-50 text-gray-600 font-semibold px-3 py-1.5 rounded-lg border border-gray-200 transition flex items-center gap-1.5">
                                <i data-lucide="x" class="w-3 h-3"></i> Tutup
                              </button>
                            </div>
                          </div>
                        </div>
                      </td>
                    </tr>`;
                }).join('')}
            </tbody>
            ${targets.length > 0 ? `
              <tfoot class="bg-gradient-to-r from-blue-50 to-indigo-50 border-t-2 border-blue-100">
                <tr>
                  <td colspan="3" class="px-5 py-4 text-center font-bold text-blue-900 text-sm">
                    TOTAL TAHUNAN ${filterTahun}
                  </td>
                  <td class="px-5 py-4 text-center font-mono font-bold text-blue-800 text-base whitespace-nowrap">
                    ${formatRupiah(totalTargetTahunan)}
                  </td>
                  <td></td>
                </tr>
              </tfoot>` : ''}
          </table>
        </div>
      </div>

      <div class="mt-5 bg-blue-50 border-l-4 border-blue-700 p-4 rounded-r-lg text-sm text-blue-900 flex items-start gap-3">
        <i data-lucide="info" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <span>Klik baris tabel untuk melihat rincian hirarki <b>Program → Sub-Kegiatan → Komponen Belanja</b>.</span>
      </div>
    `;

    renderLayout('target.html', main);
  }

  function changeTahun(y) {
    filterTahun = Number(y);
    openDetails.clear();
    render();
  }

  function toggleDetail(targetId) {
    const row = document.querySelector(`tr[data-target-id="${targetId}"]`);
    const expandRow = document.querySelector(`tr[data-expand-for="${targetId}"]`);
    if (!row || !expandRow) return;

    const container = expandRow.querySelector('.detail-expand');
    const chevron = row.querySelector('.chevron-icon');
    const isOpen = openDetails.has(targetId);

    if (isOpen) {
      openDetails.delete(targetId);
      container.classList.remove('open');
      if (chevron) chevron.classList.remove('rotate');
      row.classList.remove('bg-blue-50/60');
      setTimeout(() => {
        if (!openDetails.has(targetId)) expandRow.classList.add('hidden');
      }, 350);
    } else {
      openDetails.add(targetId);
      expandRow.classList.remove('hidden');
      void container.offsetHeight;
      container.classList.add('open');
      if (chevron) chevron.classList.add('rotate');
      row.classList.add('bg-blue-50/60');
    }
  }

  // ============================================================
  // FORM ROW KOMPONEN (setiap baris = 1 komponen belanja)
  // ============================================================
  function KomponenRowHTML(detail, idx, db) {
    const programs = db.master.program || [];
    const subKegiatans = db.master.subKegiatan || [];
    const komponens = db.master.komponenBelanja || [];

    const programOptions = programs.map(p =>
      `<option value="${p.id}" ${detail.programId === p.id ? 'selected' : ''}>${p.kode} - ${p.nama}</option>`
    ).join('');

    // Sub-kegiatan difilter berdasarkan program terpilih
    const subOptions = subKegiatans
      .filter(s => s.programId === detail.programId)
      .map(s => `<option value="${s.id}" ${detail.subKegiatanId === s.id ? 'selected' : ''}>${s.kode} - ${s.nama}</option>`)
      .join('');

    const komponenOptions = komponens.map(k =>
      `<option value="${k.id}" ${detail.komponenId === k.id ? 'selected' : ''}>${k.nama}</option>`
    ).join('');

    return `
      <div class="form-row detail-item border border-gray-200 rounded-lg p-3 bg-white" data-idx="${idx}">
        <!-- Row 1: Program + Sub-Kegiatan -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
          <div>
            <label class="text-[10px] text-gray-500 uppercase font-semibold block mb-1">Program</label>
            <select class="form-program w-full px-2.5 py-2 border border-gray-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="">- Pilih Program -</option>
              ${programOptions}
            </select>
          </div>
          <div>
            <label class="text-[10px] text-gray-500 uppercase font-semibold block mb-1">Sub-Kegiatan</label>
            <select class="form-sub w-full px-2.5 py-2 border border-gray-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="">- Pilih Sub-Kegiatan -</option>
              ${subOptions}
            </select>
          </div>
        </div>

        <!-- Row 2: Komponen + Nominal + Hapus -->
        <div class="grid grid-cols-[1fr_180px_40px] gap-2 items-end">
          <div>
            <label class="text-[10px] text-gray-500 uppercase font-semibold block mb-1">Komponen Belanja</label>
            <select class="form-komponen w-full px-2.5 py-2 border border-gray-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="">- Pilih Komponen -</option>
              ${komponenOptions}
            </select>
          </div>
          <div>
            <label class="text-[10px] text-gray-500 uppercase font-semibold block mb-1">Nominal</label>
            <div class="relative">
              <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-[10px] font-semibold pointer-events-none">Rp</span>
              <input type="text" inputmode="numeric" autocomplete="off"
                class="form-nominal input-nominal w-full pl-7 pr-2 py-2 border border-gray-200 rounded-lg text-xs text-right font-mono focus:ring-2 focus:ring-blue-500"
                value="${formatNumberInput(getKomponenNominal(detail))}" placeholder="0" />
            </div>
          </div>
          <button type="button" onclick="removeDetailRow(this)"
            class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition flex-shrink-0" title="Hapus baris">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>`;
  }

  // ============================================================
  // FORM OPEN
  // ============================================================
  function openForm(id) {
    const t = id ? DB.find('targets', x => x.id === id) : null;
    const db = DB.load();

    const programs = db.master.program || [];
    if (programs.length === 0) {
      Swal.fire({
        icon: 'warning',
        title: 'Master Data Kosong',
        html: '<p class="text-sm text-gray-600">Belum ada Program di master data. Hubungi Admin untuk menambahkannya.</p>',
        confirmButtonText: 'Mengerti'
      });
      return;
    }

    const initialDetails = t && t.details && t.details.length > 0
      ? JSON.parse(JSON.stringify(t.details))
      : [{ programId: '', subKegiatanId: '', komponenId: '', nominal: 0, subDetails: [] }];

    Swal.fire({
      title: t ? 'Edit Target Bulanan' : 'Tambah Target Bulanan',
      width: 900,
      html: `
        <div class="text-left space-y-4 text-sm mt-2">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-gray-700 mb-1.5 text-xs uppercase tracking-wide">Tahun</label>
              <input id="f-tahun" type="number" min="2020" max="2099"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                value="${t ? t.tahun : filterTahun}" />
            </div>
            <div>
              <label class="block font-semibold text-gray-700 mb-1.5 text-xs uppercase tracking-wide">Bulan</label>
              <select id="f-bulan"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 bg-white">
                ${Array.from({length:12},(_,i)=>i+1).map(m =>
                  `<option value="${m}" ${t?.bulan === m ? 'selected' : ''}>${monthName(m)}</option>`
                ).join('')}
              </select>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block font-semibold text-gray-700 text-xs uppercase tracking-wide">
                Komponen Belanja <span class="text-gray-400 normal-case font-normal">(${initialDetails.length} item)</span>
              </label>
              <button type="button" onclick="addDetailRow()"
                class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-md transition flex items-center gap-1">
                <i data-lucide="plus" class="w-3 h-3"></i> Tambah Baris
              </button>
            </div>
            <div id="detail-container" class="space-y-2 max-h-96 overflow-y-auto pr-1">
              ${initialDetails.map((d, idx) => KomponenRowHTML(d, idx, db)).join('')}
            </div>
          </div>

          <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-lg p-3 flex items-center justify-between">
            <span class="text-sm font-semibold text-blue-900 flex items-center gap-2">
              <i class="w-4 h-4"></i> Total Target Bulanan
            </span>
            <span id="f-total" class="text-lg font-bold text-blue-800 font-mono">Rp 0</span>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: t ? 'Update' : 'Simpan',
      cancelButtonText: 'Batal',
      customClass: {
        confirmButton: 'bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-lg mx-1 transition',
        cancelButton: 'bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-5 py-2.5 rounded-lg mx-1 transition',
        popup: 'rounded-2xl'
      },
      buttonsStyling: false,
      didOpen: () => {
        if (window.lucide) lucide.createIcons();
        attachAllRowEvents();
        updateTotal();
      },
      preConfirm: () => {
        const tahun = Number(document.getElementById('f-tahun').value);
        const bulan = Number(document.getElementById('f-bulan').value);

        if (!tahun || tahun < 2020 || tahun > 2099) {
          Swal.showValidationMessage('Tahun tidak valid');
          return false;
        }
        if (!bulan || bulan < 1 || bulan > 12) {
          Swal.showValidationMessage('Bulan tidak valid');
          return false;
        }

        const rows = document.querySelectorAll('#detail-container .form-row');
        const details = [];
        let valid = true;
        let errMsg = '';

        rows.forEach((row, idx) => {
          const programId = Number(row.querySelector('.form-program').value);
          const subKegiatanId = Number(row.querySelector('.form-sub').value);
          const komponenId = Number(row.querySelector('.form-komponen').value);
          const nominal = parseNumberInput(row.querySelector('.form-nominal').value);

          if (!programId) { valid = false; errMsg = `Baris ${idx+1}: Program belum dipilih`; return; }
          if (!komponenId) { valid = false; errMsg = `Baris ${idx+1}: Komponen belum dipilih`; return; }
          if (nominal <= 0) { valid = false; errMsg = `Baris ${idx+1}: Nominal harus > 0`; return; }

          details.push({
            programId,
            subKegiatanId: subKegiatanId || null,
            komponenId,
            nominal,
            subDetails: []
          });
        });

        if (!valid) { Swal.showValidationMessage(errMsg); return false; }
        if (details.length === 0) { Swal.showValidationMessage('Minimal 1 komponen'); return false; }

        // Cek duplikat kombinasi
        const keys = details.map(d => `${d.programId}-${d.subKegiatanId}-${d.komponenId}`);
        const dupe = keys.find((k, i) => keys.indexOf(k) !== i);
        if (dupe) {
          Swal.showValidationMessage('Ada kombinasi Program-Sub-Komponen yang duplikat');
          return false;
        }

        return { tahun, bulan, details };
      }
    }).then(r => {
      if (!r.isConfirmed) return;
      const data = r.value;
      const db = DB.load();
      const unit = AUTH.currentUser().unit || 'Bagian Keuangan';
      const totalNominal = data.details.reduce((s, d) => s + getKomponenNominal(d), 0);

      if (t) {
        const idx = db.targets.findIndex(x => x.id === id);
        const beforeTotal = getTotalTargetBulanan(db.targets[idx]);
        db.targets[idx] = { ...db.targets[idx], ...data };
        DB.save(db);
        recordAudit({
          action: 'UPDATE',
          module: 'Target',
          recordId: `TGT-${String(id).padStart(5, '0')}`,
          before: `${monthName(t.bulan)} ${t.tahun} - ${formatRupiah(beforeTotal)}`,
          after: `${monthName(data.bulan)} ${data.tahun} - ${formatRupiah(totalNominal)} (${data.details.length} item)`
        });
        toastSuccess('Target berhasil diupdate');
        openDetails.add(id);
      } else {
        if (db.targets.some(x => x.tahun === data.tahun && x.bulan === data.bulan)) {
          toastError(`Target untuk ${monthName(data.bulan)} ${data.tahun} sudah ada`);
          return;
        }
        const newId = db.meta.nextTargetId || (Math.max(0, ...db.targets.map(x => x.id)) + 1);
        db.meta.nextTargetId = newId + 1;
        db.targets.push({ id: newId, ...data, unit });
        DB.save(db);
        recordAudit({
          action: 'CREATE',
          module: 'Target',
          recordId: `TGT-${String(newId).padStart(5, '0')}`,
          after: `${monthName(data.bulan)} ${data.tahun} - ${formatRupiah(totalNominal)} (${data.details.length} item)`
        });
        toastSuccess('Target berhasil ditambahkan');
        openDetails.add(newId);
      }
      render();
    });
  }

  // ============================================================
  // ADD / REMOVE ROW
  // ============================================================
  function addDetailRow() {
    const container = document.getElementById('detail-container');
    if (!container) return;
    const db = DB.load();

    const newRow = KomponenRowHTML(
      { programId: '', subKegiatanId: '', komponenId: '', nominal: 0, subDetails: [] },
      container.children.length,
      db
    );
    container.insertAdjacentHTML('beforeend', newRow);

    if (window.lucide) lucide.createIcons();
    attachAllRowEvents();
    updateTotal();
  }

  function removeDetailRow(btn) {
    const row = btn.closest('.form-row');
    if (!row) return;
    const container = document.getElementById('detail-container');
    if (container.children.length === 1) {
      toastError('Minimal 1 baris harus ada');
      return;
    }
    row.classList.add('removing');
    setTimeout(() => {
      row.remove();
      updateTotal();
    }, 150);
  }

  // ============================================================
  // ATTACH EVENTS
  // ============================================================
  function attachAllRowEvents() {
    document.querySelectorAll('#detail-container .form-row').forEach(row => {
      attachRowEvents(row);
    });
  }

  function attachRowEvents(row) {
    const progEl = row.querySelector('.form-program');
    const subEl = row.querySelector('.form-sub');
    const nomEl = row.querySelector('.form-nominal');

    // Program change → reload sub-kegiatan
    if (progEl && !progEl.dataset.bound) {
      progEl.addEventListener('change', () => {
        const programId = Number(progEl.value);
        const db = DB.load();
        const subs = (db.master.subKegiatan || []).filter(s => s.programId === programId);

        subEl.innerHTML = '<option value="">- Pilih Sub-Kegiatan -</option>' +
          subs.map(s => `<option value="${s.id}">${s.kode} - ${s.nama}</option>`).join('');
      });
      progEl.dataset.bound = '1';
    }

    // Nominal format
    if (nomEl && !nomEl.dataset.bound) {
      attachNumberFormat(nomEl);
      nomEl.addEventListener('input', updateTotal);
      nomEl.dataset.bound = '1';
    }
  }

  function updateTotal() {
    const totalEl = document.getElementById('f-total');
    if (!totalEl) return;
    let total = 0;
    document.querySelectorAll('#detail-container .form-nominal').forEach(inp => {
      total += parseNumberInput(inp.value);
    });
    totalEl.textContent = formatRupiah(total);
  }

  render();
</script>
</body>
</html>
