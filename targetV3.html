<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIKAP - Kelola Target</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }

  .input-nominal {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  /* Detail item animation */
  .detail-item { animation: slideIn 0.2s ease-out; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .detail-item.removing {
    animation: slideOut 0.15s ease-in forwards;
  }
  @keyframes slideOut {
    to { opacity: 0; transform: translateX(-10px); }
  }

  /* Accordion detail expand */
  .detail-expand {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .detail-expand.open {
    max-height: 800px;
  }

  /* Chevron rotate */
  .chevron-icon {
    transition: transform 0.3s ease;
  }
  .chevron-icon.rotate {
    transform: rotate(180deg);
  }

  /* Row hover untuk baris utama yang bisa di-klik */
  tr[data-target-id] {
    cursor: pointer;
  }
</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['keuangan']);
  let filterTahun = 2026;
  const openDetails = new Set(); // Track target yang sedang dibuka

  // ============ FORMAT NOMINAL HELPERS ============
  if (typeof formatNumberInput !== 'function') {
    window.formatNumberInput = function(value) {
      if (value === null || value === undefined || value === '') return '';
      const numeric = String(value).replace(/\D/g, '');
      if (numeric === '') return '';
      return Number(numeric).toLocaleString('id-ID');
    };
  }
  if (typeof parseNumberInput !== 'function') {
    window.parseNumberInput = function(value) {
      if (value === null || value === undefined || value === '') return 0;
      const numeric = String(value).replace(/\D/g, '');
      return numeric === '' ? 0 : Number(numeric);
    };
  }
  if (typeof attachNumberFormat !== 'function') {
    window.attachNumberFormat = function(input) {
      if (!input) return;
      if (input.value && !input.value.includes('.')) {
        input.value = formatNumberInput(input.value);
      }
      input.addEventListener('input', (e) => {
        const cursorPos = e.target.selectionStart;
        const oldLength = e.target.value.length;
        e.target.value = formatNumberInput(e.target.value);
        const newLength = e.target.value.length;
        const newPos = cursorPos + (newLength - oldLength);
        try { e.target.setSelectionRange(newPos, newPos); } catch(_) {}
      });
      input.addEventListener('keypress', (e) => {
        if (!/[0-9]/.test(e.key) &&
            !['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
          e.preventDefault();
        }
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text');
        const numeric = pasted.replace(/\D/g, '');
        e.target.value = formatNumberInput(numeric);
      });
    };
  }

  // ============ HELPER: TOTAL TARGET ============
  function hitungTotalBulanan(target) {
    if (!target || !target.details) return 0;
    return target.details.reduce((s, d) => s + (d.nominal || 0), 0);
  }

  function hitungTotalTahunan(tahun) {
    return DB.filter('targets', t => t.tahun === tahun)
      .reduce((s, t) => s + hitungTotalBulanan(t), 0);
  }

  // ============ RENDER UTAMA ============
  function render() {
    const targets = DB.filter('targets', t => t.tahun === filterTahun).sort((a,b) => a.bulan - b.bulan);
    const totalTargetTahunan = hitungTotalTahunan(filterTahun);
    const rataRata = targets.length > 0 ? Math.round(totalTargetTahunan / targets.length) : 0;
    const db = DB.load();
    const kategoriList = db.master.kategoriTarget || [];

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Kelola Target</h2>
          <p class="text-sm text-gray-500 mt-1">Target bulanan disusun dari komponen-komponen di dalamnya</p>
        </div>
        <button onclick="openForm()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-md shadow-blue-200 flex items-center gap-2 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Tambah Target Bulanan
        </button>
      </div>

      <!-- Stat Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
        ${statCard({
          label: 'Total Target ' + filterTahun,
          value: formatRupiah(totalTargetTahunan),
          icon: 'target',
          color: 'blue'
        })}
        ${statCard({
          label: 'Jumlah Bulan Terdaftar',
          value: targets.length + ' bulan',
          icon: 'calendar',
          color: 'emerald'
        })}
        ${statCard({
          label: 'Rata-rata per Bulan',
          value: formatRupiah(rataRata),
          icon: 'trending-up',
          color: 'amber'
        })}
      </div>

      <!-- Info Konsep -->
      <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-xl p-4 mb-5 flex items-start gap-3">
        <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center flex-shrink-0">
          <i data-lucide="lightbulb" class="w-5 h-5"></i>
        </div>
        <div class="text-sm text-gray-700">
          <p class="font-semibold text-blue-900 mb-1">Bagaimana target dihitung?</p>
          <p class="text-xs leading-relaxed">
            <b>Target Bulanan</b> = jumlah dari komponen di dalamnya (Gaji, Honor, Tukin, ATK, dll).
            <b>Target Tahunan</b> = total dari semua target bulanan. Klik pada baris untuk melihat rincian komponen.
          </p>
        </div>
      </div>

      <!-- Filter Tahun -->
      <div class="bg-white rounded-xl border border-gray-100 p-4 mb-5 shadow-sm flex flex-wrap gap-3 items-end">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Tahun Anggaran</label>
          <select id="filterTahun" onchange="changeTahun(this.value)"
            class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            ${[2026, 2025, 2024].map(y => `<option ${y === filterTahun ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="text-xs text-gray-500 ml-auto self-center">
          ${targets.length} bulan terdaftar · Total: <b class="text-blue-700">${formatRupiah(totalTargetTahunan)}</b>
        </div>
      </div>

      <!-- Tabel dengan Accordion Detail -->
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
              <tr>
                <th class="text-center px-5 py-4 font-semibold w-16">#</th>
                <th class="text-center px-5 py-4 font-semibold">Bulan</th>
                <th class="text-center px-5 py-4 font-semibold w-44">Komponen</th>
                <th class="text-center px-5 py-4 font-semibold w-56">Target</th>
                <th class="text-center px-5 py-4 font-semibold w-44">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${targets.length === 0 ? `
                <tr>
                  <td colspan="5" class="text-center py-10 text-gray-400">
                    <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                    <p class="text-sm">Belum ada target untuk tahun ${filterTahun}</p>
                    <p class="text-xs mt-1">Klik "Tambah Target Bulanan" untuk memulai</p>
                  </td>
                </tr>` :
                targets.map((t, i) => {
                  const totalBulan = hitungTotalBulanan(t);
                  const detailCount = (t.details || []).length;
                  const isOpen = openDetails.has(t.id);

                  // Sort details desc
                  const sortedDetails = [...(t.details || [])].sort((a, b) => b.nominal - a.nominal);

                  const detailRowsHtml = sortedDetails.map(d => {
                    const kat = kategoriList.find(k => k.id === d.kategoriId);
                    const pct = totalBulan > 0 ? ((d.nominal / totalBulan) * 100).toFixed(1) : 0;
                    return `
                      <tr class="border-b border-gray-100 last:border-0">
                        <td class="py-2.5 pl-8 pr-3 text-left">
                          <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-[10px] font-bold flex-shrink-0">
                              ${kat ? (kat.kode || kat.nama.substring(0, 3)).substring(0, 3) : '???'}
                            </div>
                            <span class="text-sm font-medium text-gray-800">${kat ? kat.nama : 'Tidak diketahui'}</span>
                          </div>
                        </td>
                        <td class="py-2.5 px-3 text-right font-mono text-sm font-semibold text-blue-700 whitespace-nowrap">${formatRupiah(d.nominal)}</td>
                        <td class="py-2.5 pl-3 pr-6 text-right text-xs text-gray-500 w-24">${pct}%</td>
                      </tr>`;
                  }).join('');

                  return `
                    <!-- Baris Utama -->
                    <tr class="hover:bg-blue-50/40 transition"
                        data-target-id="${t.id}"
                        onclick="toggleDetail(${t.id})">
                      <td class="px-5 py-4 text-center">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-600 text-xs font-bold">
                          ${i + 1}
                        </span>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                          <span class="font-semibold text-gray-800">${monthName(t.bulan)}</span>
                          <i data-lucide="chevron-down" class="chevron-icon w-3.5 h-3.5 text-gray-400 flex-shrink-0 ${isOpen ? 'rotate' : ''}"></i>
                        </div>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <span class="inline-flex items-center gap-1.5 text-xs bg-purple-50 text-purple-700 font-semibold px-3 py-1.5 rounded-full">
                          <i data-lucide="layers" class="w-3 h-3"></i>
                          ${detailCount} komponen
                        </span>
                      </td>
                      <td class="px-5 py-4 text-center">
                        <span class="font-mono font-bold text-blue-700 whitespace-nowrap">${formatRupiah(totalBulan)}</span>
                      </td>
                      <td class="px-5 py-4" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-center gap-1">
                          <button onclick="toggleDetail(${t.id})"
                            class="text-purple-600 hover:bg-purple-100 p-2 rounded-lg transition" title="Lihat Detail">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                          </button>
                          <button onclick="openForm(${t.id})"
                            class="text-blue-700 hover:bg-blue-100 p-2 rounded-lg transition" title="Edit">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                          </button>
                          <!-- <button onclick="deleteItem(${t.id})"
                            class="text-red-600 hover:bg-red-100 p-2 rounded-lg transition" title="Hapus">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                          </button> -->
                        </div>
                      </td>
                    </tr>

                    <!-- Baris Expand (Detail) -->
                    <tr data-expand-for="${t.id}" class="${isOpen ? '' : 'hidden'} bg-gradient-to-r from-blue-50/60 to-indigo-50/40">
                      <td colspan="5" class="p-0">
                        <div class="detail-expand ${isOpen ? 'open' : ''}">
                          <div class="px-6 py-4">
                            <!-- Header Detail -->
                            <div class="flex items-center justify-between mb-3">
                              <div class="flex items-center gap-2">
                                <i data-lucide="layers" class="w-4 h-4 text-blue-700"></i>
                                <span class="text-xs font-bold text-blue-900 uppercase tracking-wide">
                                  Rincian Komponen - ${monthName(t.bulan)} ${t.tahun}
                                </span>
                              </div>
                              <span class="text-xs text-gray-500">${detailCount} item</span>
                            </div>

                            <!-- Tabel Detail -->
                            <div class="bg-white rounded-lg border border-blue-100 overflow-hidden">
                              <table class="w-full text-sm">
                                <thead class="bg-blue-50/70">
                                  <tr>
                                    <th class="text-left pl-8 pr-3 py-2 text-[10px] uppercase text-blue-700 font-bold tracking-wider">Komponen</th>
                                    <th class="text-right px-3 py-2 text-[10px] uppercase text-blue-700 font-bold tracking-wider">Nominal</th>
                                    <th class="text-right pr-6 pl-3 py-2 text-[10px] uppercase text-blue-700 font-bold tracking-wider w-24">Porsi</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  ${detailRowsHtml || '<tr><td colspan="3" class="text-center py-4 text-gray-400 text-xs">Tidak ada komponen</td></tr>'}
                                </tbody>
                                <tfoot class="bg-blue-50 border-t-2 border-blue-200">
                                  <tr>
                                    <td class="pl-8 pr-3 py-3 font-bold text-blue-900 text-sm">TOTAL</td>
                                    <td class="px-3 py-3 text-right font-mono font-bold text-blue-800 text-sm whitespace-nowrap">${formatRupiah(totalBulan)}</td>
                                    <td class="pr-6 pl-3 py-3 text-right text-xs font-bold text-blue-700">100%</td>
                                  </tr>
                                </tfoot>
                              </table>
                            </div>

                            <!-- Action buttons bawah -->
                            <div class="flex justify-end gap-2 mt-3">
                              <button onclick="event.stopPropagation(); openForm(${t.id})"
                                class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                                <i data-lucide="edit-3" class="w-3 h-3"></i> Edit Komponen
                              </button>
                              <button onclick="event.stopPropagation(); toggleDetail(${t.id})"
                                class="text-xs bg-white hover:bg-gray-50 text-gray-600 font-semibold px-3 py-1.5 rounded-lg border border-gray-200 transition flex items-center gap-1.5">
                                <i data-lucide="x" class="w-3 h-3"></i> Tutup
                              </button>
                            </div>
                          </div>
                        </div>
                      </td>
                    </tr>`;
                }).join('')}
            </tbody>
            ${targets.length > 0 ? `
              <tfoot class="bg-gradient-to-r from-blue-50 to-indigo-50 border-t-2 border-blue-100">
                <tr>
                  <td colspan="3" class="px-5 py-4 text-center font-bold text-blue-900 text-sm">
                    TOTAL TAHUNAN ${filterTahun}
                  </td>
                  <td class="px-5 py-4 text-center font-mono font-bold text-blue-800 text-base whitespace-nowrap">
                    ${formatRupiah(totalTargetTahunan)}
                  </td>
                  <td></td>
                </tr>
              </tfoot>` : ''}
          </table>
        </div>
      </div>

      <!-- Footer Info -->
      <div class="mt-5 bg-blue-50 border-l-4 border-blue-700 p-4 rounded-r-lg text-sm text-blue-900 flex items-start gap-3">
        <i data-lucide="info" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <span>Klik pada baris tabel untuk melihat rincian komponen. Bisa buka beberapa bulan sekaligus untuk perbandingan.</span>
      </div>
    `;

    renderLayout('target.html', main);
  }

  // ============ GANTI TAHUN ============
  function changeTahun(y) {
    filterTahun = Number(y);
    openDetails.clear(); // reset expanded state
    render();
  }

  // ============================================================
  // TOGGLE DETAIL (Accordion)
  // ============================================================
  function toggleDetail(targetId) {
    const row = document.querySelector(`tr[data-target-id="${targetId}"]`);
    const expandRow = document.querySelector(`tr[data-expand-for="${targetId}"]`);
    if (!row || !expandRow) return;

    const container = expandRow.querySelector('.detail-expand');
    const chevron = row.querySelector('.chevron-icon');
    const isOpen = openDetails.has(targetId);

    if (isOpen) {
      // Tutup
      openDetails.delete(targetId);
      container.classList.remove('open');
      if (chevron) chevron.classList.remove('rotate');
      row.classList.remove('bg-blue-50/60');
      // Delay hide setelah animasi collapse selesai
      setTimeout(() => {
        if (!openDetails.has(targetId)) {
          expandRow.classList.add('hidden');
        }
      }, 350);
    } else {
      // Buka
      openDetails.add(targetId);
      expandRow.classList.remove('hidden');
      // Trigger reflow agar transition berjalan
      void container.offsetHeight;
      container.classList.add('open');
      if (chevron) chevron.classList.add('rotate');
      row.classList.add('bg-blue-50/60');
    }
  }

  // ============================================================
  // KOMPONEN: DETAIL ROW (untuk form)
  // ============================================================
  function KomponenRow(detail, idx, kategoriList, usedIds) {
    const options = kategoriList.map(k => {
      const isUsed = usedIds.includes(k.id) && detail.kategoriId !== k.id;
      const selected = detail.kategoriId === k.id;
      return `<option value="${k.id}" ${selected ? 'selected' : ''} ${isUsed ? 'disabled' : ''}>
        ${k.nama}${isUsed ? ' (sudah dipakai)' : ''}
      </option>`;
    }).join('');

    return `
      <div class="detail-row detail-item flex items-center gap-2" data-idx="${idx}">
        <select class="detail-kategori flex-1 px-2.5 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 bg-white">
          <option value="">- Pilih Komponen -</option>
          ${options}
        </select>
        <div class="relative w-48">
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs font-semibold pointer-events-none select-none">Rp</span>
          <input type="text" inputmode="numeric" autocomplete="off"
            class="detail-nominal input-nominal w-full pl-8 pr-2 py-2 border border-gray-200 rounded-lg text-sm text-right font-mono focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="${formatNumberInput(detail.nominal)}" placeholder="0" />
        </div>
        <button type="button" onclick="removeDetailRow(this)"
          class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition flex-shrink-0" title="Hapus baris">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>`;
  }

  // ============================================================
  // KOMPONEN: FORM HEADER
  // ============================================================
  function KomponenFormHeader(t, filterTahun) {
    return `
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-gray-700 mb-1.5 text-xs uppercase tracking-wide">Tahun</label>
          <input id="f-tahun" type="number" min="2020" max="2099"
            class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            value="${t ? t.tahun : filterTahun}" />
        </div>
        <div>
          <label class="block font-semibold text-gray-700 mb-1.5 text-xs uppercase tracking-wide">Bulan</label>
          <select id="f-bulan"
            class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white">
            ${Array.from({length:12},(_,i)=>i+1).map(m =>
              `<option value="${m}" ${t?.bulan === m ? 'selected' : ''}>${monthName(m)}</option>`
            ).join('')}
          </select>
        </div>
      </div>`;
  }

  // ============================================================
  // KOMPONEN: DETAIL LIST (untuk form)
  // ============================================================
  function KomponenDetailList(details, kategoriList) {
    const usedIds = details.map(d => d.kategoriId).filter(Boolean);
    return `
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block font-semibold text-gray-700 text-xs uppercase tracking-wide">Komponen Target</label>
          <button type="button" onclick="addDetailRow()"
            class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-md transition flex items-center gap-1">
            <i data-lucide="plus" class="w-3 h-3"></i> Tambah Komponen
          </button>
        </div>

        <div id="detail-container" class="space-y-2 max-h-72 overflow-y-auto pr-1">
          ${details.map((d, idx) =>
            KomponenRow(d, idx, kategoriList, usedIds.filter(id => id !== d.kategoriId))
          ).join('')}
        </div>

        <div class="mt-3 bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-lg p-3 flex items-center justify-between">
          <span class="text-sm font-semibold text-blue-900 flex items-center gap-2">
            <i class="w-4 h-4"></i> Total Target Bulanan
          </span>
          <span id="f-total" class="text-lg font-bold text-blue-800 font-mono">Rp 0</span>
        </div>
      </div>`;
  }

  // ============================================================
  // FORM OPEN (CREATE/EDIT)
  // ============================================================
  function openForm(id) {
    const t = id ? DB.find('targets', x => x.id === id) : null;
    const db = DB.load();
    const kategoriList = db.master.kategoriTarget || [];

    if (kategoriList.length === 0) {
      Swal.fire({
        icon: 'warning',
        title: 'Master Kategori Kosong',
        html: `
          <div class="text-sm text-gray-600 text-left">
            <p class="mb-3">Belum ada kategori target di master data. Hubungi Admin untuk menambahkannya.</p>
            <p class="text-xs bg-gray-50 rounded p-2 font-mono">Admin → Master Data → Kategori Target</p>
          </div>
        `,
        confirmButtonText: 'Mengerti'
      });
      return;
    }

    const initialDetails = t && t.details && t.details.length > 0
      ? JSON.parse(JSON.stringify(t.details))
      : [{ kategoriId: kategoriList[0]?.id || '', nominal: 0 }];

    Swal.fire({
      title: t ? 'Edit Target Bulanan' : 'Tambah Target Bulanan',
      width: 720,
      html: `
        <div class="text-left space-y-4 text-sm mt-2">
          ${KomponenFormHeader(t, filterTahun)}
          ${KomponenDetailList(initialDetails, kategoriList)}
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: t ? 'Update' : 'Simpan',
      cancelButtonText: 'Batal',
      customClass: {
        confirmButton: 'bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-lg mx-1 transition',
        cancelButton: 'bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-5 py-2.5 rounded-lg mx-1 transition',
        popup: 'rounded-2xl'
      },
      buttonsStyling: false,
      didOpen: () => {
        if (window.lucide) lucide.createIcons();
        attachAllDetailEvents();
        updateTotal();
      },
      preConfirm: () => {
        const tahun = Number(document.getElementById('f-tahun').value);
        const bulan = Number(document.getElementById('f-bulan').value);

        if (!tahun || tahun < 2020 || tahun > 2099) {
          Swal.showValidationMessage('Tahun harus antara 2020 - 2099');
          return false;
        }
        if (!bulan || bulan < 1 || bulan > 12) {
          Swal.showValidationMessage('Bulan tidak valid');
          return false;
        }

        const rows = document.querySelectorAll('#detail-container .detail-row');
        const details = [];
        let valid = true;
        let errMsg = '';

        rows.forEach((row, idx) => {
          const kategoriId = Number(row.querySelector('.detail-kategori').value);
          const nominal = parseNumberInput(row.querySelector('.detail-nominal').value);

          if (!kategoriId) {
            valid = false;
            errMsg = `Baris ${idx + 1}: Kategori belum dipilih`;
            return;
          }
          if (nominal <= 0) {
            valid = false;
            errMsg = `Baris ${idx + 1}: Nominal harus lebih dari 0`;
            return;
          }
          details.push({ kategoriId, nominal });
        });

        if (!valid) {
          Swal.showValidationMessage(errMsg);
          return false;
        }
        if (details.length === 0) {
          Swal.showValidationMessage('Minimal 1 komponen harus diisi');
          return false;
        }

        const kategoriIds = details.map(d => d.kategoriId);
        const dupe = kategoriIds.find((k, i) => kategoriIds.indexOf(k) !== i);
        if (dupe) {
          const kat = kategoriList.find(x => x.id === dupe);
          Swal.showValidationMessage(`Komponen "${kat.nama}" duplikat. Hapus salah satu.`);
          return false;
        }

        return { tahun, bulan, details };
      }
    }).then(r => {
      if (!r.isConfirmed) return;
      const data = r.value;
      const db = DB.load();
      const unit = AUTH.currentUser().unit || 'Bagian Keuangan';
      const totalNominal = data.details.reduce((s, d) => s + d.nominal, 0);

      if (t) {
        const idx = db.targets.findIndex(x => x.id === id);
        const beforeTotal = hitungTotalBulanan(db.targets[idx]);
        db.targets[idx] = { ...db.targets[idx], ...data };
        DB.save(db);
        recordAudit({
          action: 'UPDATE',
          module: 'Target',
          recordId: `TGT-${String(id).padStart(5, '0')}`,
          before: `${monthName(t.bulan)} ${t.tahun} - ${formatRupiah(beforeTotal)}`,
          after: `${monthName(data.bulan)} ${data.tahun} - ${formatRupiah(totalNominal)} (${data.details.length} komponen)`
        });
        toastSuccess('Target berhasil diupdate');
        // Auto-open detail jika sedang diedit
        if (!openDetails.has(id)) openDetails.add(id);
      } else {
        if (db.targets.some(x => x.tahun === data.tahun && x.bulan === data.bulan)) {
          toastError(`Target untuk ${monthName(data.bulan)} ${data.tahun} sudah ada`);
          return;
        }
        const newId = db.meta.nextTargetId || (Math.max(0, ...db.targets.map(x => x.id)) + 1);
        db.meta.nextTargetId = newId + 1;
        db.targets.push({ id: newId, ...data, unit });
        DB.save(db);
        recordAudit({
          action: 'CREATE',
          module: 'Target',
          recordId: `TGT-${String(newId).padStart(5, '0')}`,
          after: `${monthName(data.bulan)} ${data.tahun} - ${formatRupiah(totalNominal)} (${data.details.length} komponen)`
        });
        toastSuccess('Target bulanan berhasil ditambahkan');
        // Auto-open detail untuk target baru
        openDetails.add(newId);
      }
      render();
    });
  }

  // ============================================================
  // DETAIL ROW ACTIONS (Form)
  // ============================================================
  function addDetailRow() {
    const container = document.getElementById('detail-container');
    if (!container) return;
    const db = DB.load();
    const kategoriList = db.master.kategoriTarget || [];

    const usedIds = Array.from(container.querySelectorAll('.detail-kategori'))
      .map(s => Number(s.value))
      .filter(Boolean);
    const available = kategoriList.find(k => !usedIds.includes(k.id));

    const html = KomponenRow(
      { kategoriId: available ? available.id : '', nominal: 0 },
      container.children.length,
      kategoriList,
      usedIds
    );
    container.insertAdjacentHTML('beforeend', html);

    if (window.lucide) lucide.createIcons();
    attachAllDetailEvents();
    updateTotal();

    const rows = container.querySelectorAll('.detail-row');
    const lastRow = rows[rows.length - 1];
    if (lastRow) lastRow.querySelector('.detail-nominal').focus();
  }

  function removeDetailRow(btn) {
    const row = btn.closest('.detail-row');
    if (!row) return;
    const container = document.getElementById('detail-container');
    if (container.children.length === 1) {
      toastError('Minimal 1 komponen harus ada');
      return;
    }
    row.classList.add('removing');
    setTimeout(() => {
      row.remove();
      updateTotal();
    }, 150);
  }

  function attachAllDetailEvents() {
    document.querySelectorAll('#detail-container .detail-row').forEach(row => {
      const nomEl = row.querySelector('.detail-nominal');
      if (nomEl && !nomEl.dataset.bound) {
        attachNumberFormat(nomEl);
        nomEl.addEventListener('input', updateTotal);
        nomEl.dataset.bound = '1';
      }
      const katEl = row.querySelector('.detail-kategori');
      if (katEl && !katEl.dataset.bound) {
        katEl.addEventListener('change', () => {
          refreshOptions();
          updateTotal();
        });
        katEl.dataset.bound = '1';
      }
    });
  }

  function refreshOptions() {
    const container = document.getElementById('detail-container');
    if (!container) return;
    const db = DB.load();
    const kategoriList = db.master.kategoriTarget || [];
    const selects = container.querySelectorAll('.detail-kategori');

    const usedIds = Array.from(selects).map(s => Number(s.value)).filter(Boolean);

    selects.forEach(sel => {
      const currentVal = Number(sel.value);
      Array.from(sel.options).forEach(opt => {
        const optVal = Number(opt.value);
        if (!optVal) return;
        const isUsed = usedIds.includes(optVal) && currentVal !== optVal;
        opt.disabled = isUsed;
        const kat = kategoriList.find(k => k.id === optVal);
        if (kat) opt.textContent = kat.nama + (isUsed ? ' (sudah dipakai)' : '');
      });
    });
  }

  function updateTotal() {
    const totalEl = document.getElementById('f-total');
    if (!totalEl) return;
    let total = 0;
    document.querySelectorAll('#detail-container .detail-nominal').forEach(inp => {
      total += parseNumberInput(inp.value);
    });
    totalEl.textContent = formatRupiah(total);
  }

  // ============================================================
  // DELETE
  // ============================================================
  function deleteItem(id) {
    const t = DB.find('targets', x => x.id === id);
    const total = hitungTotalBulanan(t);
    const detailCount = (t.details || []).length;

    let htmlMsg = `
      <div class="text-sm text-gray-600 space-y-2">
        <p>Target <b>${monthName(t.bulan)} ${t.tahun}</b> akan dihapus permanen.</p>
        <div class="bg-gray-50 rounded-lg p-3 text-xs space-y-1">
          <div class="flex justify-between"><span>Total Target:</span><b class="text-blue-700">${formatRupiah(total)}</b></div>
          <div class="flex justify-between"><span>Komponen:</span><b>${detailCount} item</b></div>
        </div>
      </div>`;

    swalTheme.fire({
      title: 'Hapus Target Bulanan?',
      html: htmlMsg,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Ya, Hapus',
      cancelButtonText: 'Batal'
    }).then(r => {
      if (!r.isConfirmed) return;

      const db = DB.load();
      db.targets = db.targets.filter(x => x.id !== id);
      db.realisasis = db.realisasis.filter(r => r.targetId !== id);
      DB.save(db);

      recordAudit({
        action: 'DELETE',
        module: 'Target',
        recordId: `TGT-${String(id).padStart(5, '0')}`,
        before: `${monthName(t.bulan)} ${t.tahun} - ${formatRupiah(total)}`,
        after: '-'
      });

      openDetails.delete(id);
      toastSuccess('Target berhasil dihapus');
      render();
    });
  }

  // ============ INIT ============
  render();
</script>
</body>
</html>
