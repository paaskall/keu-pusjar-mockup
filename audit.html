<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Trail</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['admin', 'pimpinan']);
  let filters = { user: 'semua', modul: 'semua', action: 'semua', tanggal: '' };

  function render() {
    const db = DB.load();
    let logs = db.auditTrail.slice();

    if (filters.user !== 'semua') logs = logs.filter(l => l.userName === filters.user);
    if (filters.modul !== 'semua') logs = logs.filter(l => l.module === filters.modul);
    if (filters.action !== 'semua') logs = logs.filter(l => l.action === filters.action);
    if (filters.tanggal) logs = logs.filter(l => l.tanggal.startsWith(filters.tanggal));

    const uniqueUsers = [...new Set(db.auditTrail.map(l => l.userName))];
    const uniqueModul = [...new Set(db.auditTrail.map(l => l.module))];

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Audit Trail</h2>
          <p class="text-sm text-gray-500 mt-1">Log seluruh aktivitas sistem (append-only)</p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4 shadow-sm grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Tanggal</label>
          <input type="date" id="f-tanggal" value="${filters.tanggal}" onchange="setFilter('tanggal', this.value)"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">User</label>
          <select id="f-user" onchange="setFilter('user', this.value)" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm">
            <option value="semua">Semua</option>
            ${uniqueUsers.map(u => `<option ${filters.user === u ? 'selected' : ''}>${u}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Modul</label>
          <select id="f-modul" onchange="setFilter('modul', this.value)" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm">
            <option value="semua">Semua</option>
            ${uniqueModul.map(m => `<option ${filters.modul === m ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Aktivitas</label>
          <select id="f-action" onchange="setFilter('action', this.value)" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm">
            <option value="semua">Semua</option>
            <option ${filters.action === 'CREATE' ? 'selected' : ''}>CREATE</option>
            <option ${filters.action === 'UPDATE' ? 'selected' : ''}>UPDATE</option>
            <option ${filters.action === 'DELETE' ? 'selected' : ''}>DELETE</option>
          </select>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="render()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition">
          <i data-lucide="filter" class="w-4 h-4"></i> Tampilkan
        </button>
        <button onclick="resetFilter()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
        </button>
        <button onclick="doExport('PDF')" class="bg-red-50 hover:bg-red-100 text-red-700 text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition">
          <i data-lucide="file-text" class="w-4 h-4"></i> Export PDF
        </button>
        <button onclick="doExport('CSV')" class="bg-green-50 hover:bg-green-100 text-green-700 text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition">
          <i data-lucide="table" class="w-4 h-4"></i> Export CSV
        </button>
        <span class="ml-auto text-xs text-gray-500 self-center">${logs.length} log ditampilkan</span>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
              <tr>
                <th class="text-left px-4 py-3 font-semibold">Tanggal</th>
                <th class="text-left px-4 py-3 font-semibold">User</th>
                <th class="text-left px-4 py-3 font-semibold">Modul</th>
                <th class="text-left px-4 py-3 font-semibold">Aktivitas</th>
                <th class="text-left px-4 py-3 font-semibold">Record</th>
                <th class="text-right px-4 py-3 font-semibold w-16">Detail</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${logs.length === 0 ? `<tr><td colspan="6" class="text-center py-8 text-gray-400">Tidak ada log</td></tr>` :
                logs.map(l => `
                  <tr class="hover:bg-blue-50/40 transition cursor-pointer" onclick="showDetail(${l.id})">
                    <td class="px-4 py-3 text-gray-600 text-xs whitespace-nowrap">
                      <i data-lucide="clock" class="w-3.5 h-3.5 inline mr-1 text-gray-400"></i>${l.tanggal}
                    </td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold">${l.userName.charAt(0)}</div>
                        <span class="text-sm font-medium text-gray-800">${l.userName}</span>
                      </div>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-600">${l.module}</td>
                    <td class="px-4 py-3">${badge(l.action, l.action)}</td>
                    <td class="px-4 py-3 text-xs font-mono text-gray-600">${l.recordId}</td>
                    <td class="px-4 py-3 text-right">
                      <i data-lucide="eye" class="w-4 h-4 text-blue-700"></i>
                    </td>
                  </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="mt-5 bg-blue-50 border-l-4 border-blue-700 p-4 rounded-r-lg text-sm text-blue-900 flex items-start gap-3">
        <i data-lucide="info" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <span><b>Audit Trail bersifat append-only</b> - tidak ada tombol Hapus/Edit. Hanya tersedia Lihat, Filter, Detail, dan Export.</span>
      </div>
    `;

    renderLayout('audit.html', main);
  }

  function setFilter(k, v) { filters[k] = v; render(); }
  function resetFilter() { filters = { user: 'semua', modul: 'semua', action: 'semua', tanggal: '' }; render(); }

  function showDetail(id) {
    const l = DB.find('auditTrail', x => x.id === id);
    swalTheme.fire({
      title: 'Detail Perubahan',
      html: `
        <div class="text-left text-sm">
          <div class="mb-3 text-gray-600 text-xs">
            ${l.tanggal} - <b>${l.userName}</b> (${l.module}) - <span class="font-mono">${l.recordId}</span>
          </div>
          <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 font-mono text-xs space-y-2">
            <div><span class="text-red-700 font-bold">BEFORE</span> : ${l.before}</div>
            <div><span class="text-green-700 font-bold">AFTER</span> &nbsp;: ${l.after}</div>
          </div>
          <div class="mt-3 text-[11px] text-gray-500">
            <div>IP: ${l.ip}</div>
            <div>Action: ${l.action}</div>
          </div>
        </div>
      `,
      width: 600,
      confirmButtonText: 'Tutup'
    });
  }

  function doExport(format) {
    const logs = DB.get('auditTrail').map(l => ({
      Tanggal: l.tanggal, User: l.userName, Modul: l.module,
      Aktivitas: l.action, Record: l.recordId, Before: l.before, After: l.after
    }));
    exportData(format, 'audit_trail_' + new Date().toISOString().substring(0,10), logs);
  }

  render();
</script>
</body>
</html>
