<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kendala Realisasi</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['keuangan']);

  function render() {
    const kendalas = DB.get('kendalas').sort((a,b) => b.tanggal.localeCompare(a.tanggal));
    const db = DB.load();

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Kendala Realisasi</h2>
          <p class="text-sm text-gray-500 mt-1">Catat kendala yang menghambat realisasi</p>
        </div>
        <button onclick="openForm()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-md shadow-blue-200 flex items-center gap-2 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Tambah Kendala
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
        ${statCard({ label: 'Total Kendala', value: kendalas.length, icon: 'alert-triangle', color: 'amber' })}
        ${statCard({ label: 'Dalam Proses', value: kendalas.filter(k => k.status === 'Proses').length, icon: 'loader', color: 'blue' })}
        ${statCard({ label: 'Selesai', value: kendalas.filter(k => k.status === 'Selesai').length, icon: 'check-circle', color: 'emerald' })}
      </div>

      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
            <tr>
              <th class="text-left px-4 py-3 font-semibold">Tanggal</th>
              <th class="text-left px-4 py-3 font-semibold">Kategori</th>
              <th class="text-left px-4 py-3 font-semibold">Deskripsi</th>
              <th class="text-left px-4 py-3 font-semibold">Status</th>
              <th class="text-right px-4 py-3 font-semibold w-32">Aksi</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            ${kendalas.length === 0 ? `<tr><td colspan="5" class="text-center py-8 text-gray-400">Belum ada kendala</td></tr>` :
              kendalas.map(k => {
                const kat = db.master.kategoriKendala.find(x => x.id === k.kategoriId);
                return `
                  <tr class="hover:bg-blue-50/40 transition">
                    <td class="px-4 py-3 text-gray-700 text-xs">${formatTanggal(k.tanggal)}</td>
                    <td class="px-4 py-3">
                      <span class="inline-block px-2 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-700">${kat ? kat.nama : '-'}</span>
                    </td>
                    <td class="px-4 py-3 text-gray-800">${k.deskripsi}</td>
                    <td class="px-4 py-3">${badge(k.status === 'Selesai' ? 'Selesai' : 'Proses', k.status === 'Selesai' ? 'Selesai' : 'Proses')}</td>
                    <td class="px-4 py-3 text-right">
                      <button onclick="openForm(${k.id})" class="text-blue-700 hover:bg-blue-100 px-2 py-1 rounded transition" title="Edit">
                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                      </button>
                      <button onclick="deleteItem(${k.id})" class="text-red-600 hover:bg-red-100 px-2 py-1 rounded transition ml-1" title="Hapus">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </td>
                  </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
    `;

    renderLayout('kendala.html', main);
  }

  function openForm(id) {
    const k = id ? DB.find('kendalas', x => x.id === id) : null;
    const db = DB.load();

    Swal.fire({
      title: k ? 'Edit Kendala' : 'Tambah Kendala',
      html: `
        <div class="text-left space-y-3 text-sm">
          <div>
            <label class="block font-medium text-gray-700 mb-1">Tanggal</label>
            <input id="f-tanggal" type="date" class="w-full px-3 py-2 border border-gray-200 rounded-lg" value="${k ? k.tanggal : new Date().toISOString().substring(0,10)}" />
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Kategori</label>
            <select id="f-kategori" class="w-full px-3 py-2 border border-gray-200 rounded-lg">
              ${db.master.kategoriKendala.map(x => `<option value="${x.id}" ${k?.kategoriId === x.id ? 'selected' : ''}>${x.nama}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Deskripsi</label>
            <textarea id="f-deskripsi" rows="2" class="w-full px-3 py-2 border border-gray-200 rounded-lg">${k ? k.deskripsi : ''}</textarea>
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Dampak</label>
            <input id="f-dampak" class="w-full px-3 py-2 border border-gray-200 rounded-lg" value="${k ? k.dampak : ''}" />
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Tindak Lanjut</label>
            <input id="f-tindak" class="w-full px-3 py-2 border border-gray-200 rounded-lg" value="${k ? k.tindakLanjut : ''}" />
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Status</label>
            <select id="f-status" class="w-full px-3 py-2 border border-gray-200 rounded-lg">
              <option ${k?.status === 'Proses' ? 'selected' : ''}>Proses</option>
              <option ${k?.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
            </select>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Simpan',
      cancelButtonText: 'Batal',
      customClass: {
        confirmButton: 'bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-lg mx-1',
        cancelButton: 'bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-5 py-2.5 rounded-lg mx-1'
      },
      buttonsStyling: false,
      preConfirm: () => {
        const tanggal = document.getElementById('f-tanggal').value;
        const kategoriId = Number(document.getElementById('f-kategori').value);
        const deskripsi = document.getElementById('f-deskripsi').value.trim();
        const dampak = document.getElementById('f-dampak').value.trim();
        const tindakLanjut = document.getElementById('f-tindak').value.trim();
        const status = document.getElementById('f-status').value;
        if (!tanggal || !deskripsi) { Swal.showValidationMessage('Tanggal & deskripsi wajib'); return false; }
        return { tanggal, kategoriId, deskripsi, dampak, tindakLanjut, status, periode: new Date(tanggal).getMonth() + 1 };
      }
    }).then(r => {
      if (!r.isConfirmed) return;
      const data = r.value;
      const db = DB.load();

      if (k) {
        const idx = db.kendalas.findIndex(x => x.id === id);
        const before = db.kendalas[idx].deskripsi;
        db.kendalas[idx] = { ...db.kendalas[idx], ...data };
        DB.save(db);
        recordAudit({ action: 'UPDATE', module: 'Kendala', recordId: `KDL-${String(id).padStart(5,'0')}`, before, after: data.deskripsi });
        toastSuccess('Kendala berhasil diupdate');
      } else {
        const newId = db.meta.nextKendalaId || (Math.max(0, ...db.kendalas.map(x => x.id)) + 1);
        db.meta.nextKendalaId = newId + 1;
        db.kendalas.push({ id: newId, ...data, userId: AUTH.currentUser().id });
        DB.save(db);
        recordAudit({ action: 'CREATE', module: 'Kendala', recordId: `KDL-${String(newId).padStart(5,'0')}`, after: data.deskripsi });
        toastSuccess('Kendala berhasil ditambahkan');
      }
      render();
    });
  }

  function deleteItem(id) {
    const k = DB.find('kendalas', x => x.id === id);
    confirmAction('Hapus kendala ini?', `"${k.deskripsi}" akan dihapus.`, () => {
      DB.remove('kendalas', id);
      recordAudit({ action: 'DELETE', module: 'Kendala', recordId: `KDL-${String(id).padStart(5,'0')}`, before: k.deskripsi, after: '-' });
      toastSuccess('Kendala berhasil dihapus');
      render();
    }, { icon: 'warning', confirmText: 'Ya, Hapus' });
  }

  render();
</script>
</body>
</html>
