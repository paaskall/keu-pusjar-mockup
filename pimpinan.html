<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Pimpinan</title>
<link rel="icon" href="assets/logo-lanri.png" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app"></div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  AUTH.requireRole(['pimpinan']);
  let filterTahun = 2026;

  function render() {
    const db = DB.load();
    const totalTarget = getTotalTarget(filterTahun);
    const totalReal = getTotalRealisasi(filterTahun);
    const capaian = getCapaian(filterTahun);
    const kendalaAktif = db.kendalas.filter(k => k.status === 'Proses').length;

    const main = `
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">Dashboard Pimpinan</h2>
          <p class="text-sm text-gray-500 mt-1">Ringkasan eksekutif target &amp; realisasi</p>
        </div>
        <select onchange="changeTahun(this.value)" class="px-3 py-2 border border-gray-200 rounded-lg text-sm">
          ${[2026, 2025, 2024].map(y => `<option ${y === filterTahun ? 'selected' : ''}>${y}</option>`).join('')}
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-6">
        ${statCard({ label: 'Target ' + filterTahun, value: formatRupiah(totalTarget), icon: 'target', color: 'blue' })}
        ${statCard({ label: 'Realisasi', value: formatRupiah(totalReal), icon: 'trending-up', color: 'emerald' })}
        ${statCard({ label: 'Capaian', value: capaian + '%', icon: 'percent', color: 'amber' })}
      </div>

      <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm mb-5">
        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="list-checks" class="w-5 h-5 text-blue-700"></i> Ringkasan Per Modul
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-2 text-sm">
          <div class="flex justify-between py-2 border-b border-dashed border-gray-200">
            <span class="text-gray-500">Target</span>
            <span class="font-semibold">: ${db.targets.filter(t => t.tahun === filterTahun).length} kegiatan</span>
          </div>
          <div class="flex justify-between py-2 border-b border-dashed border-gray-200">
            <span class="text-gray-500">Pengadaan</span>
            <span class="font-semibold">: ${db.pengadaans.length} paket</span>
          </div>
          <div class="flex justify-between py-2 border-b border-dashed border-gray-200">
            <span class="text-gray-500">Realisasi</span>
            <span class="font-semibold">: ${db.realisasis.filter(r => r.tahun === filterTahun).length} transaksi</span>
          </div>
          <div class="flex justify-between py-2 border-b border-dashed border-gray-200">
            <span class="text-gray-500">Kendala</span>
            <span class="font-semibold">: ${kendalaAktif} aktif</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button onclick="exportLaporan('PDF')" class="bg-blue-700 hover:bg-blue-800 text-white font-medium py-3 rounded-lg shadow-md shadow-blue-200 flex items-center justify-center gap-2 transition">
          <i data-lucide="file-text" class="w-4 h-4"></i> EXPORT LAPORAN PDF
        </button>
        <button onclick="exportLaporan('CSV')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg shadow-md shadow-emerald-200 flex items-center justify-center gap-2 transition">
          <i data-lucide="table" class="w-4 h-4"></i> EXPORT LAPORAN CSV
        </button>
      </div>
    `;

    renderLayout('pimpinan.html', main);
  }

  function changeTahun(y) { filterTahun = Number(y); render(); }

  function exportLaporan(format) {
    const rows = DB.filter('targets', t => t.tahun === filterTahun).map(t => {
      const real = DB.filter('realisasis', r => r.targetId === t.id).reduce((s, r) => s + r.nominal, 0);
      return {
        Tahun: t.tahun,
        Bulan: monthName(t.bulan),
        Target: t.nominal,
        Realisasi: real,
        Capaian: t.nominal > 0 ? Math.round((real / t.nominal) * 100) + '%' : '0%',
        Status: real >= t.nominal ? 'Tercapai' : 'Belum Tercapai'
      };
    });
    exportData(format, `laporan_realisasi_${filterTahun}`, rows);
  }

  render();
</script>
</body>
</html>
